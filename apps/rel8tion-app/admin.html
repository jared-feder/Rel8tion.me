    function renderLoanOfficerAssignment(event, profiles) {
      const live = event.live_loan_officer || null;
      const actionKey = state.actionKey;
      const assigning = actionKey === `assign:${event.id}`;
      const ending = actionKey === `end:${event.id}`;
      const address = eventAddress(event);
      const selectedUid = live?.verified_profile_uid || live?.loan_officer_uid || profiles[0]?.uid || '';
      return `
        <article class="assignment-card">
          <div>
            <div class="assignment-title">${esc(address)}</div>
            <div class="secondary">${esc([event.host_agent_slug, eventWindow(event)].filter(Boolean).join(' | ') || event.id)}</div>
          </div>
          <div class="badges">
            ${live ? badge(`Live: ${live.loan_officer_name || live.loan_officer_slug || 'Loan Officer'}`, 'ok') : badge('No LO assigned', 'warn')}
            ${event.financing_need_count ? badge(`${event.financing_need_count} financing`, 'warn') : badge(`${event.checkin_count || 0} check-ins`, 'info')}
          </div>
          <div class="assignment-actions">
            <select id="lo_${domId(event.id)}" class="select" ${profiles.length ? '' : 'disabled'}>
              ${profiles.length ? profiles.map((profile) => `
                <option value="${esc(profile.uid)}"${profile.uid === selectedUid ? ' selected' : ''}>${esc(loanOfficerLabel(profile))}</option>
              `).join('') : '<option>No active loan officers</option>'}
            </select>
            <button class="btn primary" data-assign-lo="${esc(event.id)}" ${profiles.length && !assigning && !ending ? '' : 'disabled'}>
              <i data-lucide="user-check"></i><span>${assigning ? 'Assigning...' : live ? 'Reassign' : 'Assign live'}</span>
            </button>
            <button class="btn bad" data-end-lo="${esc(event.id)}" ${live && !assigning && !ending ? '' : 'disabled'}>
              <i data-lucide="circle-x"></i><span>${ending ? 'Removing...' : 'Remove LO'}</span>
            </button>
            <button class="btn bad" data-end-event="${esc(event.id)}" ${state.actionKey === `end_event:${event.id}` ? 'disabled' : ''}>
              <i data-lucide="octagon-x"></i><span>${state.actionKey === `end_event:${event.id}` ? 'Ending...' : 'End event'}</span>
            </button>
          </div>
          ${live?.loan_officer_calendar_url ? `<a class="small" href="${esc(live.loan_officer_calendar_url)}" target="_blank" rel="noopener">Open assigned LO calendar</a>` : ''}
        </article>
      `;
    }

    function renderPayments() {
      const rows = filterByQuery(state.command?.payments || []);
      const kitCount = rows.filter((row) => row.payment_kind === 'open_house_kit').length;
      return renderRows('Payment control', `${kitCount} kit orders / ${rows.length} billing records`, rows.slice(0, 100), (row) => {
        if (row.payment_kind === 'open_house_kit') {
          const fulfillment = row.fulfillment_status || 'needs_review';
          const paymentStatus = row.payment_status || row.status || 'paid';
          const tone = fulfillment === 'needs_review' || fulfillment === 'payment_pending'
            ? 'warn'
            : fulfillment === 'payment_failed' || fulfillment === 'cancelled'
              ? 'bad'
              : 'ok';
          const amount = row.amount_total ? money(Number(row.amount_total) / 100) : '';
          const stripeId = row.stripe_checkout_session_id ? `Stripe ${row.stripe_checkout_session_id}` : '';
          const logoStatus = row.logo_choice_status || 'not_started';
          const welcomeEmail = row.welcome_email_status || 'pending';
          const welcomeSms = row.welcome_sms_status || 'pending';
          const welcomeTone = welcomeEmail === 'sent' && welcomeSms === 'sent'
            ? 'ok'
            : welcomeEmail === 'failed' || welcomeSms === 'failed'
              ? 'bad'
              : 'warn';
          return `
            <div>
              <div class="primary">${esc(row.agent_name || 'Open House Kit buyer')}</div>
              <div class="secondary">${esc([row.brokerage, fmtPhone(row.phone), row.email].filter(Boolean).join(' | '))}</div>
              <div class="secondary">${esc([row.address_summary, stripeId].filter(Boolean).join(' | '))}</div>
              <div class="secondary">${esc([row.selected_logo_name || (row.custom_logo_url ? 'Custom logo uploaded' : ''), row.dashboard_secured_at ? 'dashboard secured' : 'magic link'].filter(Boolean).join(' | '))}</div>
              <div class="secondary">${esc([row.plan || 'kit', amount, fmtDate(row.paid_at || row.created_at)].filter(Boolean).join(' | '))}</div>
            </div>
            <div>${badge(paymentStatus, paymentStatus === 'payment_failed' ? 'bad' : 'ok')}</div>
            <div>${badge(fulfillment, tone)}</div>
            <div>${badge(`logo ${logoStatus}`, logoStatus === 'not_started' ? 'warn' : 'ok')}</div>
            <div>${badge(`email ${welcomeEmail} / text ${welcomeSms}`, welcomeTone)}</div>
          `;
        }
        return `
          <div>
            <a class="primary" href="${esc(adminAgentHref(row))}">${esc(row.agent_name || 'Unknown agent')}</a>
            <div class="secondary">${esc([row.brokerage, fmtPhone(row.phone)].filter(Boolean).join(' | '))}</div>
          </div>
          <div>${badge(row.payment_status || 'unknown', 'warn')}</div>
          <div>${badge(`${row.sign_count || 0} signs`, 'info')}</div>
          <div>${badge(`${row.lead_count || 0} leads`, 'info')}</div>
          <div>${badge(`${row.outreach_count || 0} outreach`, 'info')}</div>
        `;
      });
    }

    function reportDateMs(value) {
      const date = new Date(value || '');
      return Number.isFinite(date.getTime()) ? date.getTime() : 0;
    }

    function sortDateValue(value, direction) {
      const time = reportDateMs(value);
      if (time) return time;
      return direction === 'desc' ? Number.NEGATIVE_INFINITY : Number.POSITIVE_INFINITY;
    }

    function compareTextSort(a, b) {
      const left = String(a || '').trim();
      const right = String(b || '').trim();
      if (!left && !right) return 0;
      if (!left) return 1;
      if (!right) return -1;
      return left.localeCompare(right, undefined, { sensitivity: 'base' });
    }

    function compareDateSort(a, b, direction = 'asc') {
      const left = sortDateValue(a, direction);
      const right = sortDateValue(b, direction);
      return direction === 'desc' ? right - left : left - right;
    }

    function compareConfirmedRows(a, b) {
      const fallback = () => compareDateSort(a.scheduled_start || a.confirmed_at, b.scheduled_start || b.confirmed_at, state.reportWindow === 'upcoming' ? 'asc' : 'desc');
      switch (state.reportSort) {
        case 'open_start_asc':
          return compareDateSort(a.scheduled_start || a.confirmed_at, b.scheduled_start || b.confirmed_at, 'asc');
        case 'open_start_desc':
          return compareDateSort(a.scheduled_start || a.confirmed_at, b.scheduled_start || b.confirmed_at, 'desc');
        case 'confirmed_desc':
          return compareDateSort(a.confirmed_at || a.scheduled_start, b.confirmed_at || b.scheduled_start, 'desc');
        case 'confirmed_asc':
          return compareDateSort(a.confirmed_at || a.scheduled_start, b.confirmed_at || b.scheduled_start, 'asc');
        case 'loan_officer':
          return compareTextSort(a.loan_officer_name || 'Unassigned', b.loan_officer_name || 'Unassigned') || fallback();
        case 'agent':
          return compareTextSort(a.agent_name, b.agent_name) || fallback();
        case 'property':
          return compareTextSort(a.property_address, b.property_address) || fallback();
        case 'status':
          return compareTextSort(a.visit_status || a.review_status, b.visit_status || b.review_status) || fallback();
        default:
          return fallback();
      }
    }

    function confirmedReportRows() {
      const now = Date.now();
      return filterByQuery(state.command?.confirmed_open_houses || [])
        .filter((row) => {
          const end = reportDateMs(row.scheduled_end) || reportDateMs(row.scheduled_start) || reportDateMs(row.confirmed_at);
          if (state.reportWindow === 'upcoming') return end >= now - 2 * 60 * 60 * 1000;
          if (state.reportWindow === 'past') return end < now - 2 * 60 * 60 * 1000;
          return true;
        })
        .sort(compareConfirmedRows);
    }

    function latestInboundMessage(thread) {
      return [...(thread.messages || [])]
        .reverse()
        .find((message) => message.direction !== 'outbound' && message.body) || null;
    }

    function unfiledConfirmationRows() {
      const excluded = new Set([
        'confirmed_open_house',
        'accepted_open_house',
        'not_now',
        'drip_scheduled',
        'opted_out',
        'android_opted_out'
      ]);
      return filterByQuery(state.inbox || [])
        .filter((thread) =>
          thread.queue_row_id &&
          !isUnlinkedAndroidThread(thread) &&
          !isOptOutThread(thread) &&
          !excluded.has(thread.review_status) &&
          latestInboundMessage(thread)
        )
        .sort(newestFirst);
    }

    function renderUnfiledConfirmationCard(thread) {
      const key = thread.thread_key || thread.queue_row_id;
      const inbound = latestInboundMessage(thread);
      const reply = inbound?.body || 'Reply received.';
      const receivedAt = inbound?.received_at || inbound?.created_at || thread.last_reply_at || thread.created_at;
      const openWindow = reportDisplayWindow(thread.open_start, thread.open_end);
      const busy = state.actionKey === actionId('confirm_open_house', key);
      return `
        <article class="glass-card" style="padding:16px;">
          <div class="section-head" style="margin-bottom:10px;">
            <div>
              <div class="mini-title">${esc(thread.agent_name || 'Agent reply')}</div>
              <div class="sub">${esc(thread.address || 'No property address')}${openWindow ? ` | ${esc(openWindow)}` : ''}</div>
            </div>
            ${badge(thread.review_status || 'reply received', 'warn')}
          </div>
          <div class="conversation-preview">${esc(reply)}</div>
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;">
            <span class="small">Received ${esc(fmtDate(receivedAt))}</span>
            <button class="btn primary" data-confirm-open-house="${esc(key)}" ${busy ? 'disabled' : ''}>
              <i data-lucide="calendar-check"></i><span>${busy ? 'Saving...' : 'Review & confirm'}</span>
            </button>
          </div>
        </article>
      `;
    }

    function compactReportDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return '';
      const hour24 = date.getHours();
      const hour = hour24 % 12 || 12;
      const minute = String(date.getMinutes()).padStart(2, '0');
      const ampm = hour24 >= 12 ? 'pm' : 'am';
      return `${date.getMonth() + 1}/${date.getDate()}${hour}:${minute}${ampm}`;
    }

    function compactReportWindow(start, end) {
      const first = compactReportDate(start);
      const second = compactReportDate(end);
      if (first && second && first !== second) return `${first}-${second}`;
      return first || second || '';
    }

    function reportDisplayWindow(start, end) {
      return [fmtDate(start), fmtDate(end)]
        .filter(Boolean)
        .filter((value, index, values) => index === 0 || value !== values[0])
        .join(' - ');
    }

    function generatedStamp(date = new Date()) {
      const stamp = new Intl.DateTimeFormat('en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: 'numeric',
        minute: '2-digit'
      }).format(date).replace(',', '');
      const offset = -date.getTimezoneOffset();
      const sign = offset >= 0 ? '+' : '-';
      const absolute = Math.abs(offset);
      const hours = String(Math.floor(absolute / 60)).padStart(2, '0');
      const minutes = String(absolute % 60).padStart(2, '0');
      return `${stamp} ${sign}${hours}:${minutes}`;
    }

    function compactReportStatus(row) {
      return [
        row.visit_status || 'confirmed',
        row.review_status || 'confirmed_open_house',
        row.loan_officer_name ? `LO ${row.loan_officer_name}` : 'LO unassigned'
      ].filter(Boolean).join('/');
    }

    function reportOutboundBlocks(row) {
      const blocks = [];
      if (row.selected_sms) blocks.push(`<div><b>Initial:</b> ${esc(row.selected_sms)}</div>`);
      if (row.followup_sms) blocks.push(`<div><b>Follow-up:</b> ${esc(row.followup_sms)}</div>`);
      const outbound = (Array.isArray(row.messages) ? row.messages : [])
        .filter((message) => message.direction === 'outbound' && message.body)
        .filter((message) => message.body !== row.selected_sms && message.body !== row.followup_sms);
      outbound.forEach((message) => {
        blocks.push(`<div><b>${esc(compactReportDate(message.received_at || message.created_at))} Sent:</b> ${esc(message.body)}</div>`);
      });
      return blocks.length ? blocks.join('') : '<div class="muted">No outbound message text stored.</div>';
    }

    function reportAgentBlocks(row) {
      const inbound = (Array.isArray(row.messages) ? row.messages : [])
        .filter((message) => message.direction !== 'outbound');
      const note = row.report_note ? `<div class="note"><b>Admin note:</b> ${esc(row.report_note)}</div>` : '';
      if (!inbound.length) return note || '<div class="muted">No inbound body in reply table.</div>';
      return `${note}${inbound.map((message) => {
        const label = [compactReportDate(message.received_at || message.created_at), message.opt_out ? '[OPT OUT]' : '']
          .filter(Boolean)
          .join(' ');
        return `<div><b>${esc(label)} </b>${esc(message.body || '')}</div>`;
      }).join('')}`;
    }

    function compactReportHtml(rows) {
      const title = 'Ultra Compact Confirmed Open Houses Report';
      const windowLabel = {
        upcoming: 'upcoming confirmed',
        past: 'previous confirmed',
        all: 'all confirmed'
      }[state.reportWindow] || state.reportWindow;
      const generated = generatedStamp();
      const rowsHtml = rows.map((row, index) => {

            </td>
            <td class="me">${reportOutboundBlocks(row)}</td>
            <td class="agent">${reportAgentBlocks(row)}</td>
          </tr>

      }).join('');
      return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
<style>

</style></head><body>

<table><thead><tr><th class="n">#</th><th class="pic">Pic</th><th class="meta">Property + Agent</th><th class="me">Me</th><th class="agent">Agent</th></tr></thead><tbody>
${rowsHtml}
</tbody></table></body></html>`;
    }

    function downloadPrintableReportHtml(html) {
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const day = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `rel8tion-confirmed-open-houses-${state.reportWindow}-${day}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function generateConfirmedPdfReport() {
      const rows = confirmedReportRows();
      if (!rows.length) {
        showToast('No confirmed open houses in this report view.');
        return;
      }
      const html = compactReportHtml(rows);
      const report = window.open('', '_blank');
      if (!report) {
        downloadPrintableReportHtml(html);
        showToast('Popup blocked. Downloaded the printable report HTML.');
        return;
      }
      report.document.open();
      report.document.write(html);
      report.document.close();
      report.focus();
      window.setTimeout(() => {
        try {
          report.print();
        } catch (_) {}
      }, 700);
      showToast(`Opened PDF-style report for ${rows.length} confirmed open houses.`);
    }

              ${updateKey ? `<button class="btn soft" data-confirm-open-house="${esc(updateKey)}" ${updateBusy ? 'disabled' : ''}><i data-lucide="calendar-days"></i><span>${updateBusy ? 'Saving...' : 'Update date'}</span></button>` : ''}
              ${row.open_house_id ? `<button class="btn primary" data-create-homekey="${esc(row.open_house_id)}" data-homekey-visit="${esc(row.field_visit_id || '')}"><i data-lucide="house"></i><span>Create HomeKey QR</span></button>` : ''}
            </div>

    function renderReports() {

    function renderBarCard(title, values) {

        </div>

    function renderRows(title, subtitle, rows, rowRenderer) {
      return `
        <div class="section-head">
          <div>
            <h2>${esc(title)}</h2>
            <div class="sub">${esc(subtitle)}</div>
          </div>
        </div>
        <div class="rows">
          ${rows.length ? rows.map((row) => `<div class="data-row">${rowRenderer(row)}</div>`).join('') : '<div class="glass-card" style="padding:18px;font-weight:900;">No rows loaded.</div>'}
        </div>
      `;
    }

    function render() {
      if (!state.verified) renderLock();
      else renderShell();
    }

    verify();
    window.addEventListener('popstate', () => {
      if (!state.verified) return;
      const locationParams = new URLSearchParams(window.location.search);
      const nextArea = locationParams.get('area') || 'outreach';
      state.area = AREAS.some(([key]) => key === nextArea) ? nextArea : 'outreach';
      state.agentFocus = locationParams.get('agent') || '';
      state.agentHydrationKey = '';
      state.agentHydrationError = '';
      state.openHouseFocus = locationParams.get('open_house') || '';
      state.query = state.agentFocus;
      window.localStorage.setItem(AREA_KEY, state.area);
      syncCommandNavigation();
      refreshAreaContent();
      if (state.agentFocus) hydrateAgentProfile(state.agentFocus).catch(() => null);
    });
    window.setInterval(() => {
      refreshLiveData().catch(() => null);
    }, 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshLiveData().catch(() => null);
    });
  </script>
</body>
</html>
