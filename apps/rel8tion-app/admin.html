<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REL8TION COMMAND</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            rel8tion: {
              sky: '#38bdf8',
              mist: '#e8f8ff',
              navy: '#1f2a5a',
              ink: '#17224f',
              teal: '#0ea5c8'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            glass: '0 28px 70px rgba(23, 34, 79, 0.16), 0 2px 10px rgba(23, 34, 79, 0.06)'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --sky: #38bdf8;
      --sky-strong: #2563eb;
      --teal: #1f2a5a;
      --teal-strong: #161e40;
      --ink: #1f2a5a;
      --muted: #64748b;
      --soft: #f0f7ff;
      --line: rgba(255, 255, 255, .72);
      --glass: rgba(255, 255, 255, .50);
      --glass-strong: rgba(255, 255, 255, .74);
      --ok: #0f7b5f;
      --warn: #9a5b00;
      --bad: #b42318;
      --violet: #6657d9;
      --orange: #f97316;
      --shadow: 0 32px 90px rgba(23, 34, 79, .18), inset 0 1px 0 rgba(255,255,255,.50);
      --soft-shadow: 0 18px 44px rgba(23, 34, 79, .11), inset 0 1px 0 rgba(255,255,255,.42);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(56,189,248,.88) 0%, rgba(221,246,255,.82) 42%, rgba(248,252,255,.96) 100%),
        url("https://rel8tion.info/wp-content/uploads/2026/04/trythisbackround.png");
      background-size: cover;
      background-position: center bottom;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: 0;
      background-image: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDYwMCAyMDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZyI+PHBhdGggZD0iTTEyMCwxNTAgQzgwLDE1MCA2MCwxMzAgNjAsMTAwIEM2MCw4MCA4MCw2MCAxMTAsNjAgQzEyMCwzMCAxNTAsMTAgMTkwLDEwIEMyNDAsMTAgMjcwLDQwIDI4MCw3MCBDMzEwLDcwIDM0MCw5MCAzNDAsMTIwIEMzNDAsMTUwIDMxMCwxNTAgMjgwLDE1MCBaIiBmaWxsPSIjZmZmZmZmIiBvcGFjaXR5PSIwLjgyIi8+PHBhdGggZD0iTTQ1MCwxMjAgQzQyMCwxMjAgNDAwLDEwNSA0MDAsODUgQzQwMCw3MCA0MTUsNTUgNDM1LDU1IEM0NDUsMzUgNDY1LDIwIDQ5MCwyMCBDNTI1LDIwIDU0NSw0MCA1NTUsNjAgQzU3NSw2MCA1OTUsNzUgNTk1LDk1IEM1OTUsMTIwIDU3NSwxMjAgNTUwLDEyMCBaIiBmaWxsPSIjZmZmZmZmIiBvcGFjaXR5PSIwLjU4Ii8+PHBhdGggZD0iTTMwLDE4MCBDMTAsMTgwIDAsMTcwIDAsMTU1IEMwLDE0MCAxNSwxMzAgMzAsMTMwIEMzNSwxMTUgNTAsMTA1IDcwLDEwNSBDOTUsMTA1IDExMCwxMjAgMTE1LDEzNSBDMTMwLDEzNSAxNDUsMTQ1IDE0NSwxNjAgQzE0NSwxNjAgMTMwLDE4MCAxMTUsMTgwIFoiIGZpbGw9IiNmZmZmZmYiIG9wYWNpdHk9IjAuNjgiLz48L3N2Zz4=");
      background-repeat: repeat-x;
      background-size: 800px auto;
      background-position: 0 8px;
      opacity: .72;
      animation: drift 120s linear infinite;
    }

    body::after {
      z-index: 0;
      top: auto;
      height: 70vh;
      background:
        linear-gradient(180deg, rgba(240,247,255,.08), rgba(240,247,255,.92)),
        url("https://rel8tion.info/wp-content/uploads/2026/04/trythisbackround.png");
      background-size: cover;
      background-position: center bottom;
      opacity: .30;
    }

    @keyframes drift {
      from { background-position-x: 0; }
      to { background-position-x: 800px; }
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .58; }

    #app {
      position: relative;
      z-index: 1;
    }

    .app {
      min-height: 100vh;
      padding: 34px 22px;
    }

    .command-shell {
      width: min(1520px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: calc(100vh - 68px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 26px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.42), rgba(226,246,255,.22)),
        rgba(255,255,255,.18);
      backdrop-filter: blur(28px) saturate(175%);
      -webkit-backdrop-filter: blur(28px) saturate(175%);
      box-shadow: var(--shadow);
    }

    .command-sidebar {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 18px;
      padding: 20px 12px;
      border-right: 1px solid rgba(255,255,255,.54);
      background:
        linear-gradient(180deg, rgba(255,255,255,.68), rgba(255,255,255,.36)),
        rgba(255,255,255,.34);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 14px;
      border-bottom: 1px solid rgba(122,148,173,.16);
    }

    .sidebar-brand img {
      width: 64px;
      height: auto;
      flex: 0 0 auto;
    }

    .sidebar-brand strong {
      display: block;
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .sidebar-brand span {
      display: block;
      margin-top: 4px;
      color: #62748a;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .area-nav {
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .nav-section-title {
      margin: 14px 10px 4px;
      color: #7a8da3;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #31465f;
      padding: 10px 11px;
      text-align: left;
      font-weight: 900;
      text-decoration: none;
    }

    .nav-button svg {
      width: 18px;
      height: 18px;
      color: #66839e;
    }

    .nav-button:hover,
    .nav-button.active {
      border-color: rgba(91,141,255,.20);
      background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(236,245,255,.74));
      color: #2445d8;
      box-shadow: 0 10px 24px rgba(72, 91, 150, .08);
    }

    .nav-button.active svg { color: #2445d8; }

    .outreach-control-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .outreach-control-grid > .glass-card { grid-column: span 12; }
    .outreach-control-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .outreach-control-metric { border: 1px solid rgba(219,234,254,.95); border-radius: 8px; background: rgba(255,255,255,.72); padding: 14px; }
    .outreach-control-metric strong { display: block; margin-top: 5px; font-family: "Plus Jakarta Sans", Inter, sans-serif; font-size: 28px; line-height: 1; }
    .outreach-control-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .outreach-control-field { display: grid; gap: 6px; }
    .outreach-control-field label { color: #526b84; font-size: 11px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
    .outreach-protection-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .outreach-protection { display: flex; align-items: flex-start; gap: 8px; border: 1px solid rgba(187,247,208,.9); border-radius: 8px; background: rgba(240,253,244,.74); padding: 10px; color: #166534; font-size: 12px; font-weight: 800; }
    .outreach-protection svg { width: 16px; min-width: 16px; }

    .sidebar-card {
      margin: 0 6px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.72), rgba(228,247,255,.38)),
        rgba(255,255,255,.38);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: var(--soft-shadow);
      padding: 13px;
      display: grid;
      gap: 8px;
    }

    .sidebar-card .value {
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .command-workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(240,247,255,.42)),
        url("https://rel8tion.info/wp-content/uploads/2026/04/trythisbackround.png");
      background-size: cover;
      background-position: center bottom;
    }

    .topbar {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(260px, 430px) minmax(190px, 280px) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 8px;
      background: rgba(255,255,255,.56);
      backdrop-filter: blur(20px) saturate(165%);
      -webkit-backdrop-filter: blur(20px) saturate(165%);
      box-shadow: var(--soft-shadow);
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: #6b7d92;
      transform: translateY(-50%);
    }

    .search-wrap .field {
      padding-left: 38px;
      font-weight: 800;
    }

    .command-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 12px;
      align-items: stretch;
    }

    .hero-panel,
    .score-panel {
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 8px;
      background: rgba(255,255,255,.54);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      box-shadow: var(--soft-shadow);
      padding: 16px;
    }

    .hero-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      background:
        linear-gradient(135deg, rgba(255,255,255,.68), rgba(222,247,255,.32)),
        rgba(255,255,255,.42);
    }

    .hero-label {
      color: #41708d;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .hero-title {
      margin: 5px 0 0;
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: clamp(30px, 4vw, 56px);
      font-weight: 800;
      line-height: .95;
      letter-spacing: 0;
    }

    .hero-copy {
      max-width: 720px;
      margin-top: 9px;
      color: #4a6075;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
    }

    .hero-stack {
      display: grid;
      gap: 8px;
      min-width: 190px;
    }

    .hero-mini {
      border: 1px solid rgba(122,148,173,.18);
      border-radius: 8px;
      background: rgba(255,255,255,.76);
      padding: 10px;
    }

    .score-panel {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .score-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.92) 0 53%, transparent 54%),
        conic-gradient(var(--teal) calc(var(--score, 74) * 1%), rgba(207, 222, 235, .62) 0);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.86), 0 14px 32px rgba(23,32,51,.08);
    }

    .score-ring span {
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .header-actions,
    .row-actions,
    .control-row,
    .badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--glass-strong);
      color: var(--ink);
      padding: 9px 12px;
      font-weight: 900;
      line-height: 1;
      max-width: 100%;
      white-space: normal;
      text-align: center;
      box-shadow: 0 8px 20px rgba(23,32,51,.04);
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }

    .btn svg { width: 17px; height: 17px; }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn.primary:hover { background: var(--teal-strong); border-color: var(--teal-strong); }
    .btn.soft { background: rgba(255,255,255,.58); }
    .btn.bad { color: var(--bad); border-color: rgba(180,35,24,.25); background: rgba(255,247,247,.8); }

    .select,
    .field,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(119, 146, 173, .42);
      border-radius: 8px;
      background: rgba(255,255,255,.86);
      color: var(--ink);
      outline: none;
      font-weight: 800;
      padding: 9px 11px;
    }

    textarea {
      resize: vertical;
      min-height: 104px;
      max-height: 240px;
      line-height: 1.45;
      font-weight: 600;
    }

    .select:focus,
    .field:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15,143,189,.16);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 10px;
    }

    .stat-card,
    .glass-card,
    .outreach-card {
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.62), rgba(236,249,255,.34)),
        var(--glass);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      box-shadow: var(--soft-shadow);
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 13px;
      min-height: 108px;
      display: grid;
      align-content: space-between;
      gap: 14px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.70), rgba(246,251,255,.38)),
        var(--glass);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .stat-card:hover,
    .stat-card:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(91,141,255,.34);
      box-shadow: 0 20px 52px rgba(23, 34, 79, .15), inset 0 1px 0 rgba(255,255,255,.58);
      outline: none;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      inset: auto -18px -28px auto;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(15,143,189,.12);
    }

    .stat-card.sky::after { background: rgba(40,168,223,.16); }
    .stat-card.violet::after { background: rgba(102,87,217,.14); }
    .stat-card.green::after { background: rgba(15,123,95,.14); }
    .stat-card.orange::after { background: rgba(249,115,22,.16); }
    .stat-card.rose::after { background: rgba(244,63,94,.13); }

    .stat-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .stat-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(122,148,173,.18);
      background: rgba(255,255,255,.72);
      color: var(--teal);
    }

    .stat-icon svg {
      width: 18px;
      height: 18px;
    }

    .stat-card .value {
      position: relative;
      z-index: 1;
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
    }

    .stat-card .label {
      color: #446175;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .meter {
      position: relative;
      z-index: 1;
      height: 5px;
      border-radius: 999px;
      background: rgba(122,148,173,.16);
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), #13b287);
    }

    .main-grid {
      display: grid;
      gap: 12px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      padding: 6px 2px 0;
    }

    .section-head h2 {
      margin: 0;
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .section-head .sub {
      margin-top: 4px;
      color: #426175;
      font-size: 13px;
      font-weight: 800;
    }

    .event-pass-freshener {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: 16px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .event-pass-freshener-copy,
    .event-pass-freshener-controls {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .event-pass-camera {
      display: none;
      width: 100%;
      max-height: 420px;
      border-radius: 8px;
      background: #10172f;
      object-fit: cover;
    }

    .event-pass-camera.active { display: block; }

    .event-pass-scanner-status {
      min-height: 42px;
      border: 1px solid rgba(119, 146, 173, .28);
      border-radius: 8px;
      background: rgba(255,255,255,.62);
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
    }

    .event-pass-scanner-status[data-tone="ok"] { color: var(--ok); border-color: rgba(15,123,95,.28); }
    .event-pass-scanner-status[data-tone="bad"] { color: var(--bad); border-color: rgba(180,35,24,.28); }
    .event-pass-scanner-status[data-tone="working"] { color: var(--teal); border-color: rgba(31,42,90,.28); }

    .outreach-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .outreach-card {
      overflow: visible;
      background:
        linear-gradient(135deg, rgba(255,255,255,.62), rgba(232,248,255,.30)),
        rgba(255,255,255,.42);
    }

    .outreach-main {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
      min-height: 100%;
    }

    .media-col {
      background: rgba(255,255,255,.22);
      border-right: 1px solid var(--line);
      padding: 10px;
      display: grid;
      gap: 9px;
      align-content: start;
    }

    .listing-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.72);
      background: #dff3ff;
      display: block;
    }

    .image-fallback {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.72);
      background: linear-gradient(135deg, rgba(55,189,244,.28), rgba(255,255,255,.74));
      display: grid;
      place-items: center;
      padding: 12px;
      text-align: center;
      color: #31566a;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .agent-strip {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      padding: 8px;
      border-radius: 8px;

  <script>
    const ADMIN_UID_KEY = 'rel8tion_admin_uid';
    const ADMIN_TOKEN_KEY = 'rel8tion_admin_token';
    const ADMIN_LOCAL_LOCK_KEY = 'rel8tion_admin_local_lock_v1';
    const ADMIN_LOCK_SESSION_KEY = 'rel8tion_admin_lock_session_v1';
    const ADMIN_LOCK_DURATION_MS = 8 * 60 * 60 * 1000;
    const OUTREACH_FOLLOWUPS_DISABLED = true;
    const DRAFTS_KEY = 'rel8tion_admin_reply_drafts';
    const AREA_KEY = 'rel8tion_admin_area';

    const AREAS = [
      ['outreach', 'Outreach command'],
      ['outreachControl', 'Outreach Control'],
      ['leads', 'Leads'],
      ['crm', 'Agent Performance'],
      ['buyerFinder', 'Buyer finder'],
      ['events', 'Open houses'],
      ['signs', 'Signs'],
      ['lo', 'Loan officers'],
      ['payments', 'Payments'],
      ['reports', 'Reports']
    ];

    const state = {
      verified: false,
      credentialVerified: false,
      lockStep: 'credentials',
      loading: false,
      liveRefreshing: false,
      relationshipsLoading: false,
      sendingKey: '',
      actionKey: '',
      error: '',
      area: window.localStorage.getItem(AREA_KEY) || 'outreach',
      query: '',
      agentFocus: '',
      agentHydrationKey: '',
      agentHydrationError: '',
      openHouseFocus: '',
      outreachThreadLimit: 40,
      agentBoardLimit: 60,
      futureOpenHouseLimit: 60,
      agentDetailLimits: { threads: 20, upcoming: 20, listings: 20 },
      outreachFilter: 'needs_reply',
      reportWindow: 'all',
      reportSort: 'auto',
      futureOpenHouseFilters: {
        agent: '',
        relationship: 'all',
        dateFrom: '',
        dateTo: '',
        timeFrom: '',
        timeTo: ''
      },
      buyerFinder: {
        loading: false,
        error: '',
        loaded: false,
        loaded_at: '',
        rows: [],
        summary: null,
        warnings: [],
        filters: {
          q: '',
          days: '14',
          min_price: '',
          max_price: '',
          min_beds: '',
          min_baths: '',
          city: '',
          state: '',
          brokerage: '',
          agent: '',
          photo_only: false,
          sort: 'open_start_asc',
          report_title: 'Buyer Home Finder Report',
          buyer_name: ''
        }
      },
      coveragePickerKey: '',
      homekeyModal: null,
      inbox: [],
      counts: { all: 0, inbound: 0, needs_reply: 0, interested: 0, opt_out: 0 },
      command: null,
      commandIndexes: {
        crmSorted: [],
        futureOpenHouses: []
      },
      relationshipIndexes: {
        byPhone: new Map(),
        bySlug: new Map(),
        byEmail: new Map(),
        byName: new Map()
      },
      health: null,
      outreachControl: null,
      relationships: [],
      outreachSearch: { query: '', rows: [], loading: false, error: '' },
      loadedAt: '',
      drafts: readDrafts(),
      replyPhotos: {},
      agentPhotoUploadKey: '',
      eventPassFreshenerResult: null,
      qrBatchType: 'agent'
    };

    const eventPassScanner = {
      stream: null,
      frame: 0,
      detecting: false,
      submitting: false,
      detector: null,
      decoderPromise: null
    };

    const app = document.getElementById('app');
    const toast = document.getElementById('toast');

    const params = new URLSearchParams(window.location.search);
    const uidParam = params.get('uid') || params.get('admin_uid') || '';
    const tokenParam = params.get('token') || params.get('admin_token') || '';
    const areaParam = params.get('area') || '';
    const eventParam = params.get('event') || '';
    const agentParam = params.get('agent') || params.get('q') || '';
    const openHouseParam = params.get('open_house') || '';
    if (uidParam) window.localStorage.setItem(ADMIN_UID_KEY, uidParam);
    if (tokenParam) window.localStorage.setItem(ADMIN_TOKEN_KEY, tokenParam);
    if (AREAS.some(([key]) => key === areaParam)) {
      state.area = areaParam;
      window.localStorage.setItem(AREA_KEY, areaParam);
    }
    if (eventParam && state.area === 'events') state.query = eventParam;
    if (agentParam && (state.area === 'crm' || state.area === 'outreach')) state.query = agentParam;
    if (agentParam && state.area === 'crm') state.agentFocus = agentParam;
    if (openHouseParam && state.area === 'crm') state.openHouseFocus = openHouseParam;

    function credential() {
      return {
        uid: window.localStorage.getItem(ADMIN_UID_KEY) || '',
        token: window.localStorage.getItem(ADMIN_TOKEN_KEY) || ''
      };
    }

    function authHeaders() {
      const cred = credential();
      const headers = { 'Content-Type': 'application/json' };
      if (cred.uid) headers['x-admin-uid'] = cred.uid;
      if (cred.token) headers['x-admin-token'] = cred.token;
      return headers;
    }

    function adminLockSubject() {
      const cred = credential();
      if (cred.uid) return `uid:${cred.uid}`;
      if (cred.token) return 'token:fallback-admin';
      return 'admin';
    }

    function readAdminLocalLock() {
      try {
        const lock = JSON.parse(window.localStorage.getItem(ADMIN_LOCAL_LOCK_KEY) || 'null');
        return lock?.subject === adminLockSubject() ? lock : null;
      } catch (_) {
        return null;
      }
    }

    function saveAdminLocalLock(lock) {
      window.localStorage.setItem(ADMIN_LOCAL_LOCK_KEY, JSON.stringify(lock));
    }

    function clearAdminLockSession() {
      window.sessionStorage.removeItem(ADMIN_LOCK_SESSION_KEY);
    }

    function setAdminLockSession(lock) {
      window.sessionStorage.setItem(ADMIN_LOCK_SESSION_KEY, JSON.stringify({
        lock_id: lock.id,
        subject: lock.subject,
        unlocked_at: new Date().toISOString(),
        expires_at: new Date(Date.now() + ADMIN_LOCK_DURATION_MS).toISOString()
      }));
    }

    function adminLockSessionValid(lock) {
      try {
        const session = JSON.parse(window.sessionStorage.getItem(ADMIN_LOCK_SESSION_KEY) || 'null');
        return Boolean(
          lock?.id
          && session?.lock_id === lock.id
          && session?.subject === lock.subject
          && new Date(session.expires_at || 0).getTime() > Date.now()
        );
      } catch (_) {
        return false;
      }
    }

    function ensureAdminLocalLock() {
      const lock = readAdminLocalLock();
      if (!lock) {
        state.lockStep = 'setup';
        return false;
      }
      if (adminLockSessionValid(lock)) {
        state.lockStep = 'unlocked';
        return true;
      }
      state.lockStep = 'unlock';
      return false;
    }

    function randomBytes(length = 32) {
      const bytes = new Uint8Array(length);
      window.crypto.getRandomValues(bytes);
      return bytes;
    }

    function bytesToBase64Url(bytes) {
      let binary = '';
      new Uint8Array(bytes).forEach((byte) => { binary += String.fromCharCode(byte); });
      return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function base64UrlToBytes(value) {
      const clean = String(value || '');
      const padded = `${clean.replace(/-/g, '+').replace(/_/g, '/')}${'='.repeat((4 - (clean.length % 4)) % 4)}`;
      return Uint8Array.from(window.atob(padded), (char) => char.charCodeAt(0));
    }

    async function pinDigest(pin, salt) {
      const bytes = new TextEncoder().encode(`${salt}:${pin}`);
      const digest = await window.crypto.subtle.digest('SHA-256', bytes);
      return bytesToBase64Url(new Uint8Array(digest));
    }

    function passkeyAvailable() {
      return Boolean(window.PublicKeyCredential && navigator.credentials?.create && navigator.credentials?.get);
    }

    async function buildPinLock(pin) {
      const salt = bytesToBase64Url(randomBytes(18));
      return {
        id: bytesToBase64Url(randomBytes(18)),
        subject: adminLockSubject(),
        pin_salt: salt,
        pin_hash: await pinDigest(pin, salt),
        passkey: null,
        created_at: new Date().toISOString(),
        note: 'Local admin lock concept. Hardened production version should verify server-side.'
      };
    }

    async function registerAdminPasskey(lock) {
      if (!passkeyAvailable()) throw new Error('This browser does not support phone/passkey unlock.');
      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: randomBytes(32),
          rp: { name: 'REL8TION' },
          user: {
            id: randomBytes(16),
            name: 'rel8tion-admin',
            displayName: 'REL8TION COMMAND'
          },
          pubKeyCredParams: [
            { type: 'public-key', alg: -7 },
            { type: 'public-key', alg: -257 }
          ],
          authenticatorSelection: {
            authenticatorAttachment: 'platform',
            residentKey: 'preferred',
            userVerification: 'required'
          },
          timeout: 60000,
          attestation: 'none'
        }
      });
      if (!credential?.rawId) throw new Error('Phone/passkey setup was cancelled.');
      return {
        id: bytesToBase64Url(new Uint8Array(credential.rawId)),
        type: credential.type || 'public-key',
        created_at: new Date().toISOString()
      };
    }

    async function unlockAdminWithPasskey(lock) {
      if (!lock?.passkey?.id) throw new Error('Phone unlock is not set up on this browser.');
      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: randomBytes(32),
          allowCredentials: [{
            id: base64UrlToBytes(lock.passkey.id),
            type: lock.passkey.type || 'public-key'
          }],
          userVerification: 'required',
          timeout: 60000
        }
      });
      if (!assertion?.rawId) throw new Error('Phone unlock was cancelled.');
      setAdminLockSession(lock);
    }

    async function unlockAdminWithPin(pin) {
      const lock = readAdminLocalLock();
      if (!lock) throw new Error('No admin PIN is set on this browser.');
      const hash = await pinDigest(pin, lock.pin_salt);
      if (hash !== lock.pin_hash) throw new Error('That PIN did not match.');
      setAdminLockSession(lock);
    }

    function readDrafts() {
      try {
        return JSON.parse(window.localStorage.getItem(DRAFTS_KEY) || '{}') || {};
      } catch (_) {
        return {};
      }
    }

    function saveDrafts() {
      window.localStorage.setItem(DRAFTS_KEY, JSON.stringify(state.drafts));
    }

    function editableControl(element) {
      if (!element || element === document.body || typeof element.closest !== 'function') return null;
      return element.closest('textarea, input, select, [contenteditable="true"]');
    }

    function isCommandEditing() {
      const active = editableControl(document.activeElement);
      if (!active || active.disabled || active.readOnly) return false;
      return Boolean(active.closest('.command-shell, .coverage-modal'));
    }

    function captureUiState() {
      const active = editableControl(document.activeElement);
      const hasSelection = active && typeof active.selectionStart === 'number';
      return {
        scrollX: window.scrollX || 0,
        scrollY: window.scrollY || 0,
        activeId: active?.id || '',
        activeValue: active && 'value' in active ? active.value : undefined,
        selectionStart: hasSelection ? active.selectionStart : null,
        selectionEnd: hasSelection ? active.selectionEnd : null
      };
    }

    function restoreUiState(snapshot) {
      if (!snapshot) return;
      window.requestAnimationFrame(() => {
        const active = snapshot.activeId ? document.getElementById(snapshot.activeId) : null;
        if (active && !active.disabled) {
          if (snapshot.activeValue !== undefined && 'value' in active && active.value !== snapshot.activeValue) {
            active.value = snapshot.activeValue;
          }
          active.focus({ preventScroll: true });
          if (typeof active.setSelectionRange === 'function' && snapshot.selectionStart !== null) {
            active.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd ?? snapshot.selectionStart);
          }
        }
        window.scrollTo(snapshot.scrollX || 0, snapshot.scrollY || 0);
      });
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function fmtDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return '';
      return new Intl.DateTimeFormat('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(date);
    }

    function phoneDigits(value) {
      const digits = String(value || '').replace(/\D/g, '');
      return digits.length === 11 && digits.startsWith('1') ? digits.slice(1) : digits;
    }

    function fmtPhone(value) {
      const digits = String(value || '').replace(/\D/g, '');
      const ten = digits.length === 11 && digits.startsWith('1') ? digits.slice(1) : digits;
      if (ten.length !== 10) return value || '';
      return `(${ten.slice(0, 3)}) ${ten.slice(3, 6)}-${ten.slice(6)}`;
    }

    function money(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '';
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
    }

    function initials(value) {
      return String(value || 'R')
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0]?.toUpperCase())
        .join('') || 'R';
    }

    function renderAgentAvatar(row) {
      if (row?.image_url) {
        return `<div class="agent-avatar-wrap"><img class="avatar" src="${esc(row.image_url)}" alt="${esc(row.name || 'Agent')}"></div>`;
      }
      const lookup = agentLookupValue(row);
      const busy = Boolean(lookup && state.agentPhotoUploadKey === lookup);
      return `
        <div class="agent-avatar-wrap">
          <div class="avatar-fallback">${esc(initials(row?.name))}</div>
          ${lookup ? `
            <button class="agent-photo-add" type="button" data-agent-photo-pick="${esc(lookup)}" aria-label="Add photo for ${esc(row?.name || 'agent')}" title="Add agent photo" ${busy ? 'disabled' : ''}>
              <i data-lucide="${busy ? 'loader-circle' : 'plus'}"></i>
            </button>
            <input class="agent-photo-input" type="file" accept="image/jpeg,image/png,image/webp" data-agent-photo-input="${esc(lookup)}">
          ` : ''}
        </div>
      `;
    }

    function domId(value) {
      return `k_${String(value || '').replace(/[^a-z0-9_-]/gi, '_')}`;
    }

    function isOptOutThread(thread) {
      return Boolean(thread?.any_opt_out || thread?.latest_reply_opt_out || ['opted_out', 'android_opted_out'].includes(thread?.review_status));
    }

    function isLinkedOutreachThread(thread) {
      return Boolean(thread?.queue_row_id || thread?.agent_name || thread?.agent_phone || thread?.agent_phone_normalized);
    }

    function isUnlinkedAndroidThread(thread) {
      const android = thread?.raw_inbound === true ||
        thread?.account_sid === 'android_gateway' ||
        String(thread?.latest_message_sid || '').startsWith('raw-android:');
      return android && !(thread?.queue_row_id && (thread?.agent_name || thread?.agent_phone || thread?.agent_phone_normalized));
    }

    function isHandledThread(thread) {
      return ['interested', 'confirmed_open_house', 'accepted_open_house', 'drip_scheduled'].includes(thread?.review_status);
    }

    function needsReply(thread) {
      return isLinkedOutreachThread(thread) && thread?.direction !== 'outbound' && !isOptOutThread(thread) && !isHandledThread(thread);
    }

    function threadText(thread) {
      const messages = Array.isArray(thread?.messages) ? thread.messages : [];
      return [
        thread?.latest_reply_body,
        ...messages
          .filter((message) => message.direction !== 'outbound')
          .map((message) => message.body)
      ].filter(Boolean).join(' ').toLowerCase();
    }

    function isInterestedThread(thread) {
      if (!thread || isOptOutThread(thread)) return false;
      if (isHandledThread(thread)) return true;
      const text = threadText(thread);
      if (!text) return false;
      if (/\b(no|stop|remove|unsubscribe|wrong number|not interested|do not|don't)\b/i.test(text)) return false;
      return /\b(yes|yeah|yep|sure|absolutely|ok|okay|come by|stop by|come over|please come|that works|sounds good|interested|available|schedule|call me|text me)\b/i.test(text);
    }

    function badge(text, type = 'info') {
      return `<span class="badge ${type}">${esc(text)}</span>`;
    }

    function countValue(primary, fallback = 0) {
      return primary === undefined || primary === null ? fallback : primary;
    }

    function deliveryBadge(row, step = 'initial') {
      const status = row?.[`${step}_delivery_status`] || '';
      const errorCode = row?.[`${step}_delivery_error_code`] || '';
      if (!status) return row?.[`${step}_sent_at`] ? badge('delivery pending', 'warn') : '';
      const normalized = String(status).toLowerCase();
      const tone = ['delivered'].includes(normalized)
        ? 'ok'
        : ['failed', 'undelivered', 'canceled'].includes(normalized)
          ? 'bad'
          : 'info';
      return badge(`${normalized}${errorCode ? ` ${errorCode}` : ''}`, tone);
    }

    function isOutreachReadyCandidate(row) {
      if (!row) return false;
      if (row.generation_status !== 'generated' || row.mockup_status !== 'rendered') return false;
      if (!row.listing_photo_url) return false;
      const initialPending = row.initial_send_status === 'pending' && row.selected_sms;
      const followupPending = !OUTREACH_FOLLOWUPS_DISABLED && row.followup_send_status === 'pending' && row.followup_sms;
      return Boolean(initialPending || followupPending);
    }

    function isOutreachSendCandidate(row) {
      if (!row || row.send_mode !== 'automatic') return false;
      return isOutreachReadyCandidate(row);
    }

    function outreachOperatorMode() {
      return state.command?.outreach_operator?.mode === 'away' ? 'away' : 'live';
    }

    function isOutreachCronReady(row) {
      if (!row) return false;
      return isOutreachSendCandidate({ ...row, send_mode: 'automatic' });
    }

    function sendApprovalBadge(row) {
      if (row?.send_mode && row.send_mode !== 'automatic' && isOutreachCronReady(row)) return badge('Manual ready', 'warn');
      if (isOutreachSendCandidate(row) && outreachOperatorMode() === 'live') return badge('Manual ready', 'warn');
      if (isOutreachSendCandidate(row)) return badge('Auto ready', 'ok');
      if (row?.send_mode && row.send_mode !== 'automatic') return badge('Paused', 'info');
      if (row?.generation_status === 'generated' && row?.mockup_status === 'rendered') return badge('Not due', 'info');
      return '';
    }

    function sendApprovalControls(row, key) {
      if (!row?.queue_row_id && !row?.id) return '';
      const candidate = isOutreachCronReady(row);
      const paused = row.send_mode && row.send_mode !== 'automatic';
      const approveBusy = state.actionKey === actionId('approve_send', key);
      const holdBusy = state.actionKey === actionId('hold_send', key);
      if (!paused) {
        return `
          <button class="btn soft" data-hold-send="${esc(key)}" ${holdBusy ? 'disabled' : ''}>
            <i data-lucide="pause-circle"></i><span>${holdBusy ? 'Pausing...' : 'Pause cron'}</span>
          </button>
        `;
      }
      return `
        <button class="btn primary" data-approve-send="${esc(key)}" ${!candidate || approveBusy ? 'disabled' : ''}>
          <i data-lucide="play-circle"></i><span>${approveBusy ? 'Resuming...' : 'Resume cron'}</span>
        </button>
      `;
    }

    function statusBadge(thread) {
      if (isOptOutThread(thread)) return badge('Opted out', 'bad');
      if (thread.review_status === 'confirmed_open_house') return badge('Confirmed OH', 'ok');
      if (thread.review_status === 'accepted_open_house') return badge('Accepted OH', 'ok');
      if (thread.review_status === 'drip_scheduled') return badge('Drip scheduled', 'ok');
      if (thread.review_status === 'interested' || isInterestedThread(thread)) return badge('Interested', 'ok');
      if (needsReply(thread)) return badge('Needs reply', 'warn');
      if (thread.direction === 'outbound') return badge('Sent', 'info');
      return badge('Inbound', 'info');
    }

    function outreachThreadHaystack(thread) {
      const messages = Array.isArray(thread.messages) ? thread.messages : [];
      return [
        thread.agent_name,
        thread.brokerage,
        thread.address,
        thread.agent_phone,
        thread.from_phone,
        thread.to_phone,
        thread.selected_sms,
        thread.latest_reply_body,
        thread.report_note,
        thread.outreach_code,
        thread.queue_row_id,
        ...messages.map((message) => message.body)
      ].filter(Boolean).join(' ').toLowerCase();
    }

    function passesOutreachFilter(thread) {
      if (state.outreachFilter === 'all') return true;
      if (state.outreachFilter === 'inbound') return thread.direction !== 'outbound';
      if (state.outreachFilter === 'needs_reply') return needsReply(thread);
      if (state.outreachFilter === 'interested') return isInterestedThread(thread);
      if (state.outreachFilter === 'opt_out') return isOptOutThread(thread);
      return true;
    }

    function filteredInbox() {
      const query = state.query.trim().toLowerCase();
      return state.inbox.filter((thread) => {
        if (isUnlinkedAndroidThread(thread)) return false;
        if (query) return outreachThreadHaystack(thread).includes(query);
        return passesOutreachFilter(thread);
      });
    }

    function newestFirst(a, b) {
      return new Date(b?.last_reply_at || 0) - new Date(a?.last_reply_at || 0);
    }

    function latestInboundThreads(limit = 8) {
      return [...(state.inbox || [])]
        .filter((thread) => thread.direction !== 'outbound' && isLinkedOutreachThread(thread) && !isUnlinkedAndroidThread(thread))
        .sort(newestFirst)
        .slice(0, limit);
    }

    function healthTone(status) {
      return status === 'ok' ? 'ok' : status === 'bad' ? 'bad' : 'warn';
    }

    function filterByQuery(rows) {
      const query = state.query.trim().toLowerCase();
      if (!query) return rows || [];
      return (rows || []).filter((row) => {
        try {
          return JSON.stringify(row || {}).toLowerCase().includes(query);
        } catch (_) {
          return false;
        }
      });
    }

    function outreachQueueHaystack(row) {
      return [
        row.id,
        row.agent_name,
        row.brokerage,
        row.address,
        row.agent_phone,
        row.agent_phone_normalized,
        row.open_house_id,
        row.selected_sms,
        row.report_note,
        row.outreach_code,
        row.initial_send_status,
        row.followup_send_status,
        row.review_status
      ].filter(Boolean).join(' ').toLowerCase();
    }

    function outreachQueueSearchMatches(limit = 12) {
      const query = state.query.trim().toLowerCase();
      if (!query) return [];
      const found = new Map();
      for (const row of (state.command?.outreach?.recent || [])) {
        if (outreachQueueHaystack(row).includes(query)) found.set(row.id, row);
      }
      if (state.outreachSearch?.query === state.query.trim()) {
        for (const row of (state.outreachSearch.rows || [])) {
          if (row?.id) found.set(row.id, row);
        }
      }
      return [...found.values()].slice(0, limit);
    }

    function queueThreadKey(row) {
      return `queue:${row?.id || ''}`;
    }

    function queueRowToThread(row) {
      if (!row?.id) return null;
      return {
        ...row,
        thread_key: queueThreadKey(row),
        queue_row_id: row.id,
        direction: row.initial_sent_at ? 'outbound' : 'queued',
        last_reply_at: row.initial_sent_at || row.last_outreach_at || row.created_at || '',
        messages: []
      };
    }

    function agentRelationship(row) {
      if (!row) return null;
      const phone = phoneDigits(row.agent_phone_normalized || row.phone_normalized || row.agent_phone || row.phone);
      const email = String(row.agent_email || row.email || '').trim().toLowerCase();
      const slug = String(row.agent_slug || row.slug || '').trim().toLowerCase();
      const name = String(row.agent_name || row.name || '').trim().toLowerCase();
      const brokerage = String(row.brokerage || row.company || '').trim().toLowerCase();
      const indexes = state.relationshipIndexes;
      if (phone) return indexes.byPhone.get(phone) || null;
      if (slug) return indexes.bySlug.get(slug) || null;
      if (email) return indexes.byEmail.get(email) || null;
      const nameMatches = indexes.byName.get(name) || [];
      return nameMatches.find((relationship) => {
        const relationshipBrokerage = String(relationship.company || relationship.brokerage || '').trim().toLowerCase();
        return !brokerage || !relationshipBrokerage || brokerage === relationshipBrokerage;
      }) || null;
    }

    function buildRelationshipIndexes(relationships) {
      const indexes = {
        byPhone: new Map(),
        bySlug: new Map(),
        byEmail: new Map(),
        byName: new Map()
      };
      const setFirst = (map, key, relationship) => {
        if (key && !map.has(key)) map.set(key, relationship);
      };
      for (const relationship of relationships || []) {
        const phone = phoneDigits(relationship.phone_normalized || relationship.phone);
        const slug = String(relationship.agent_slug || '').trim().toLowerCase();
        const email = String(relationship.email || '').trim().toLowerCase();
        const name = String(relationship.name || relationship.display_name || '').trim().toLowerCase();
        setFirst(indexes.byPhone, phone, relationship);
        setFirst(indexes.bySlug, slug, relationship);
        setFirst(indexes.byEmail, email, relationship);
        if (name) {
          const nameMatches = indexes.byName.get(name) || [];
          nameMatches.push(relationship);
          indexes.byName.set(name, nameMatches);
        }
      }
      return indexes;
    }

    function relationshipToCommandAgent(relationship) {
      return {
        id: `relationship:${relationship.id}`,
        relationship_id: relationship.id,
        agent_id: '',
        slug: relationship.agent_slug || '',
        name: relationship.name || relationship.display_name || 'Saved agent',
        phone: relationship.phone || relationship.phone_normalized || '',
        phone_normalized: relationship.phone_normalized || phoneDigits(relationship.phone),
        email: relationship.email || '',
        brokerage: relationship.company || relationship.brokerage || '',
        image_url: relationship.photo_url || '',
        relationship_status: relationship.relationship_status || 'known',
        keychain_count: 0,
        outreach_count: 0,
        reply_count: 0,
        lead_count: 0,
        listing_count: 0,
        upcoming_open_house_count: 0,
        historical_open_house_count: 0,
        accepted_open_house_count: 0,
        listings: [],
        upcoming_open_houses: [],
        outreach_threads: [],
        latest_outreach: null,
        latest_activity: null,
        sources: ['saved agent']
      };
    }

    function agentRelationshipGroup(row) {
      const relationship = agentRelationship(row);
      const relationshipStatus = String(relationship?.relationship_status || row?.relationship_status || '').trim().toLowerCase();
      const serverCategory = String(row?.relationship_category || '');
      const threads = Array.isArray(row?.outreach_threads) ? row.outreach_threads : [];
      const statuses = new Set(threads.map((thread) => String(thread.review_status || '').trim().toLowerCase()));
      const accepted = serverCategory === 'accepted_worked'
        || relationship?.worked_with_agent
        || relationship?.historical_open_house_agent
        || Number(relationship?.confirmed_open_houses || 0) > 0
        || ['accepted_open_house', 'confirmed_open_house', 'worked_with'].includes(relationshipStatus)
        || ['accepted_open_house', 'confirmed_open_house', 'worked_with'].some((status) => statuses.has(status));
      const interested = serverCategory === 'interested'
        || ['interested', 'drip_scheduled'].includes(relationshipStatus)
        || ['interested', 'drip_scheduled'].some((status) => statuses.has(status));
      const priorOutreach = row?.has_prior_outreach === true
        || threads.some((thread) => thread.has_sent_outreach === true || thread.latest_reply_at);
      if (accepted) return { category: 'accepted_worked', label: 'Accepted / worked with', priority: 0, tone: 'ok' };
      if (interested) return { category: 'interested', label: 'Interested', priority: 1, tone: 'warn' };
      if (priorOutreach) return { category: 'prior_outreach', label: 'Prior outreach', priority: 2, tone: 'info' };
      if (relationship || ['known', 'prospect'].includes(relationshipStatus)) return { category: 'saved_agent', label: 'Saved agent', priority: 3, tone: 'info' };
      return { category: 'new', label: 'New agent', priority: 4, tone: 'info' };
    }

    function compareAgentRelationships(left, right) {
      const relationshipDelta = agentRelationshipGroup(left).priority - agentRelationshipGroup(right).priority;
      if (relationshipDelta) return relationshipDelta;
      const upcomingDelta = Number((right.upcoming_open_house_count || 0) > 0) - Number((left.upcoming_open_house_count || 0) > 0);
      if (upcomingDelta) return upcomingDelta;
      const startDelta = new Date(left.upcoming_open_houses?.[0]?.open_start || 0) - new Date(right.upcoming_open_houses?.[0]?.open_start || 0);
      if (startDelta) return startDelta;
      return String(left.name || '').localeCompare(String(right.name || ''));
    }

    function localDateValue(value) {
      const date = new Date(value || 0);
      if (!Number.isFinite(date.getTime())) return '';
      const pad = (part) => String(part).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function timeMinutes(value) {
      const [hours, minutes] = String(value || '').split(':').map(Number);
      return Number.isFinite(hours) && Number.isFinite(minutes) ? (hours * 60) + minutes : null;
    }

    function futureOpenHouseMatches(row) {
      const filters = state.futureOpenHouseFilters;
      const search = String(filters.agent || '').trim().toLowerCase();
      const haystack = [
        row.agent_name,
        row.brokerage,
        row.agent_phone,
        row.agent_email,
        row.address,
        row.source,
        fmtDate(row.open_start)
      ].filter(Boolean).join(' ').toLowerCase();
      if (search && !haystack.includes(search)) return false;
      if (filters.relationship !== 'all' && row.relationship_category !== filters.relationship) return false;

      const localDate = localDateValue(row.open_start);
      if (filters.dateFrom && localDate < filters.dateFrom) return false;
      if (filters.dateTo && localDate > filters.dateTo) return false;

      const startsAt = new Date(row.open_start || 0);
      const rowMinutes = Number.isFinite(startsAt.getTime()) ? (startsAt.getHours() * 60) + startsAt.getMinutes() : null;
      const fromMinutes = timeMinutes(filters.timeFrom);
      const toMinutes = timeMinutes(filters.timeTo);
      if (fromMinutes !== null && rowMinutes !== null && rowMinutes < fromMinutes) return false;
      if (toMinutes !== null && rowMinutes !== null && rowMinutes > toMinutes) return false;
      return true;
    }

    function agentIsPinned(row) {
      return Boolean(agentRelationship(row)?.pinned);

    function agentNeedsFollowUp(row) {

    async function api(path, options = {}) {
      const method = String(options.method || 'GET').toUpperCase();
      const requestPath = method === 'GET' ? cacheBust(path) : path;
      const response = await fetch(requestPath, {
        ...options,
        cache: 'no-store',
        headers: {
          ...authHeaders(),
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || `Request failed: ${response.status}`);
      }
      return data;
    }

    function readAgentPhotoFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('The selected photo could not be read.'));
        reader.readAsDataURL(file);
      });
    }

    function loadAgentPhotoImage(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Choose a valid JPG, PNG, or WebP image.'));
        image.src = dataUrl;
      });
    }

    async function prepareAgentPhoto(file) {
      if (!file || !['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        throw new Error('Choose a JPG, PNG, or WebP image.');
      }
      if (file.size > 15 * 1024 * 1024) {
        throw new Error('Choose an image smaller than 15 MB.');
      }
      const image = await loadAgentPhotoImage(await readAgentPhotoFile(file));
      const targetWidth = 1200;
      const targetHeight = 1500;
      const targetRatio = targetWidth / targetHeight;
      const sourceRatio = image.naturalWidth / image.naturalHeight;
      let sourceWidth = image.naturalWidth;
      let sourceHeight = image.naturalHeight;
      let sourceX = 0;
      let sourceY = 0;
      if (sourceRatio > targetRatio) {
        sourceWidth = image.naturalHeight * targetRatio;
        sourceX = (image.naturalWidth - sourceWidth) / 2;
      } else {
        sourceHeight = image.naturalWidth / targetRatio;
        sourceY = (image.naturalHeight - sourceHeight) / 2;
      }
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('This browser could not prepare the photo.');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, targetWidth, targetHeight);
      context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, targetWidth, targetHeight);
      const dataUrl = canvas.toDataURL('image/jpeg', .88);
      if (!dataUrl.startsWith('data:image/jpeg;base64,')) {
        throw new Error('This browser could not prepare the photo.');
      }
      return { dataUrl, width: targetWidth, height: targetHeight };
    }

    function cacheBust(path) {
      try {
        const url = new URL(path, window.location.origin);
        url.searchParams.set('_rel8tion_ts', String(Date.now()));
        return `${url.pathname}${url.search}${url.hash}`;
      } catch (_) {
        const joiner = String(path || '').includes('?') ? '&' : '?';
        return `${path}${joiner}_rel8tion_ts=${Date.now()}`;
      }
    }

    function rebuildCommandIndexes() {
      const crmRows = [...(state.command?.crm || [])];
      state.relationshipIndexes = buildRelationshipIndexes(state.relationships || []);
      const crmIndexByRelationshipId = new Map();
      for (let index = 0; index < crmRows.length; index += 1) {
        const relationship = agentRelationship(crmRows[index]);
        if (relationship?.id && !crmIndexByRelationshipId.has(relationship.id)) {
          crmIndexByRelationshipId.set(relationship.id, index);
        }
      }
      for (const relationship of state.relationships || []) {
        const savedAgent = relationshipToCommandAgent(relationship);
        const index = crmIndexByRelationshipId.get(relationship.id) ?? -1;
        if (index >= 0) {
          crmRows[index] = {
            ...savedAgent,
            ...crmRows[index],
            relationship_id: relationship.id,
            relationship_status: relationship.relationship_status || crmRows[index].relationship_status || 'known',
            sources: [...new Set([...(crmRows[index].sources || []), 'saved agent'])]
          };
        } else {
          crmRows.push(savedAgent);
        }
      }
      const crmSorted = crmRows.sort(compareAgentRelationships);
      const futureOpenHouseMap = new Map();
      for (const agent of crmSorted) {
        const relationshipGroup = agentRelationshipGroup(agent);
        for (const openHouse of agent.upcoming_open_houses || []) {
          const key = openHouse.id || `${openHouse.address || ''}|${openHouse.open_start || ''}`;
          if (!key || futureOpenHouseMap.has(key)) continue;
          futureOpenHouseMap.set(key, {
            ...openHouse,
            agent_name: agent.name,
            agent_phone: agent.phone,
            agent_phone_normalized: agent.phone_normalized,
            agent_email: agent.email,
            brokerage: agent.brokerage,
            relationship_category: relationshipGroup.category,
            relationship_label: relationshipGroup.label,
            relationship_priority: relationshipGroup.priority,
            relationship_tone: relationshipGroup.tone
          });
        }
      }
      state.commandIndexes = {
        crmSorted,
        futureOpenHouses: [...futureOpenHouseMap.values()]
      };
    }

    async function verify() {
      const cred = credential();
      if (!cred.uid && !cred.token) {
        state.verified = false;
        state.credentialVerified = false;
        state.lockStep = 'credentials';
        render();
        return;
      }

      try {
        await api('/api/admin/auth');
        state.credentialVerified = true;
        if (!ensureAdminLocalLock()) {
          state.verified = false;
          state.error = '';
          render();
          return;
        }
        state.verified = true;
        state.error = '';
        await loadAll();
      } catch (error) {
        state.verified = false;
        state.credentialVerified = false;
        state.lockStep = 'credentials';
        state.error = error.message || 'Unauthorized.';
        render();
      }
    }

    async function loadAll(options = {}) {
      const uiSnapshot = options.preserveUi === false ? null : captureUiState();
      state.loading = true;
      if (options.showLoading !== false) {
        render();
        restoreUiState(uiSnapshot);
      }
      try {
        const [dashboard, inbox, health, outreachControl] = await Promise.all([
          api('/api/admin/dashboard').catch((error) => ({ ok: false, error: error.message })),
          api('/api/admin/outreach-inbox?limit=600'),
          api('/api/admin/outreach-health?hours=96').catch((error) => ({ ok: false, status: 'bad', error: error.message })),
          api('/api/admin/outreach-control').catch((error) => ({ ok: false, error: error.message }))
        ]);
        state.command = dashboard.ok === false ? null : dashboard;
        state.inbox = inbox.inbox || [];
        state.counts = inbox.counts || state.counts;
        state.health = health;
        state.outreachControl = outreachControl;
        rebuildCommandIndexes();
        state.loadedAt = inbox.loaded_at || dashboard.loaded_at || new Date().toISOString();
        const restoreSnapshot = isCommandEditing() ? captureUiState() : uiSnapshot;
        state.loading = false;
        render();
        restoreUiState(restoreSnapshot);
        if (state.agentFocus) hydrateAgentProfile(state.agentFocus).catch(() => null);
        refreshRelationshipsInBackground().catch(() => null);
      } catch (error) {
        const restoreSnapshot = isCommandEditing() ? captureUiState() : uiSnapshot;
        state.loading = false;
        state.error = error.message || 'Unable to load command data.';
        render();
        restoreUiState(restoreSnapshot);
      }
    }

      state.relationshipsLoading = true;
      try {
        const relationships = await api('/api/admin/agent-relationships?view=summary&limit=1000');
        state.relationships = relationships.agents || state.relationships;
        rebuildCommandIndexes();
        if (state.area === 'crm') refreshAreaContent();
      } catch (_) {

    async function refreshLiveData() {
      if (!state.verified || state.loading || state.liveRefreshing || document.visibilityState !== 'visible') return;
      if (state.sendingKey || state.actionKey || state.coveragePickerKey || state.homekeyModal || isCommandEditing()) return;
      state.liveRefreshing = true;
      try {
        const controlRequest = state.area === 'outreachControl'
          ? api('/api/admin/outreach-control').catch((error) => ({ ok: false, error: error.message }))
          : Promise.resolve(state.outreachControl);

        ]);

      if (filters.min_baths) pieces.push(`${filters.min_baths}+ baths`);

    function buyerFinderResultAngle(row) {
      const facts = [

    async function sendReply(key, displayedMediaSource = '', displayedMediaId = '') {
      const thread = findThread(key);
      const textarea = document.getElementById(`reply_${domId(key)}`);
      const messageBody = textarea?.value?.trim() || '';
      const selectedPhoto = state.replyPhotos[key];
      const includePhoto = Boolean(
        selectedPhoto?.source && selectedPhoto?.id
        && selectedPhoto.source === displayedMediaSource
        && selectedPhoto.id === displayedMediaId
      );

      if (!thread?.queue_row_id) {
        showToast('No queue row is linked to this thread.');
        return;
      }
      if (isOptOutThread(thread)) {
        showToast('This contact is opted out.');
        return;
      }
      if (!messageBody) {
        showToast('Write the reply first.');
        return;
      }
      if (!window.confirm(`Send this ${includePhoto ? 'photo message' : 'SMS'} to ${thread.agent_name || fmtPhone(thread.agent_phone) || 'this contact'}?`)) {
        return;
      }

      state.drafts[key] = messageBody;
      saveDrafts();
      state.sendingKey = key;
      refreshAreaContent();
      try {
        await api('/api/admin/outreach-reply', {
          method: 'POST',
          body: JSON.stringify({
            id: thread.queue_row_id,
            body: messageBody,
            media_source: includePhoto ? selectedPhoto.source : undefined,
            media_id: includePhoto ? selectedPhoto.id : undefined
          })
        });
        delete state.drafts[key];
        delete state.replyPhotos[key];
        saveDrafts();
        state.sendingKey = '';
        showToast(includePhoto ? 'Photo message sent.' : 'Reply sent.');
        await loadAll();

        state.sendingKey = '';
        showToast(error.message || 'Unable to send reply.');

      const visit = fieldVisitForThread(thread);
      const report = reportRowForThread(thread);
      const participant = primaryVisitParticipant(visit);
      const assignedUid = participant?.participant_uid || participant?.participant_profile_id || report?.loan_officer_uid || '';
      const assignedName = participant?.participant_name || report?.loan_officer_name || '';
      return {
        visit,
        report,
        participant,
        assignedUid,
        assignedName,
        assignedPhone: participant?.participant_phone || report?.loan_officer_phone || '',
        assignedCompany: participant?.participant_company || report?.loan_officer_company || '',
        acceptedAt: visit?.confirmed_at || visit?.created_at || report?.confirmed_at || '',
        scheduledStart: visit?.scheduled_start || report?.scheduled_start || thread?.open_start || '',
        scheduledEnd: visit?.scheduled_end || report?.scheduled_end || thread?.open_end || ''

    function findThread(key) {
      const inboxThread = state.inbox.find((item) => item.thread_key === key || item.queue_row_id === key);
      if (inboxThread) return inboxThread;

      const queueId = String(key || '').replace(/^queue:/, '');
      for (const profile of state.command?.crm || []) {
        const profileThread = (profile.outreach_threads || []).find((item) => String(item.id) === queueId);
        if (!profileThread) continue;
        return {
          ...profileThread,
          id: profileThread.id,
          thread_key: queueThreadKey({ id: profileThread.id }),
          queue_row_id: profileThread.id,
          agent_name: profile.name,
          agent_phone: profile.phone,
          agent_phone_normalized: profile.phone_normalized,
          agent_email: profile.email,
          agent_photo_url: profile.image_url,
          brokerage: profile.brokerage,
          selected_sms: profileThread.body || '',
          any_opt_out: profileThread.opted_out === true,
          latest_reply_opt_out: profileThread.opted_out === true,
          direction: profileThread.latest_reply_direction || (profileThread.has_sent_outreach ? 'outbound' : 'queued'),
          messages: []
        };
      }

      const searchRow = (state.outreachSearch?.rows || []).find((item) => item.id === queueId);
      if (searchRow) return queueRowToThread(searchRow);

      const recentRow = (state.command?.outreach?.recent || []).find((item) => item.id === queueId);
      if (recentRow) return queueRowToThread(recentRow);

      const reportRow = (state.command?.confirmed_open_houses || []).find((item) => item.queue_row_id === queueId);
      return reportRowToThread(reportRow);
    }

    function toLocalInputValue(date) {
      const d = new Date(date);
      if (!Number.isFinite(d.getTime())) return '';
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function dateInputValue(date) {
      const d = new Date(date);
      if (!Number.isFinite(d.getTime())) return '';
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function timeInputValue(date, fallback = '13:00') {
      const d = new Date(date || '');
      if (!Number.isFinite(d.getTime())) return fallback;
      const pad = (number) => String(number).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function dateTimeFromParts(dateText, timeText, fallbackHour = 13) {
      const dateMatch = String(dateText || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!dateMatch) return null;
      const timeMatch = String(timeText || '').trim().match(/^(\d{2}):(\d{2})$/);
      const hour = timeMatch ? Number(timeMatch[1]) : fallbackHour;
      const minute = timeMatch ? Number(timeMatch[2]) : 0;
      if (hour > 23 || minute > 59) return null;
      const year = Number(dateMatch[1]);
      const month = Number(dateMatch[2]) - 1;
      const day = Number(dateMatch[3]);
      const date = new Date(year, month, day, hour, minute, 0, 0);
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
      ) return null;
      return date;
    }

    function dateAtTime(dateText, timeSource, fallbackHour = 13) {
      const match = String(dateText || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      const source = new Date(timeSource || '');
      const hour = Number.isFinite(source.getTime()) ? source.getHours() : fallbackHour;
      const minute = Number.isFinite(source.getTime()) ? source.getMinutes() : 0;
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), hour, minute, 0, 0);
    }

    function fallbackCoverageEnd(start) {
      const date = new Date(start || Date.now());
      if (!Number.isFinite(date.getTime())) return new Date(Date.now() + 2 * 60 * 60 * 1000);
      return new Date(date.getTime() + 2 * 60 * 60 * 1000);
    }

    function normalizeCoverageWindow(start, end, label) {
      const startDate = new Date(start || '');
      if (!Number.isFinite(startDate.getTime())) return null;
      const endDate = new Date(end || '');
      const finalEnd = Number.isFinite(endDate.getTime()) && endDate > startDate ? endDate : fallbackCoverageEnd(startDate);
      return {
        coverage_start: startDate.toISOString(),
        coverage_end: finalEnd.toISOString(),
        coverage_label: label || `${fmtDate(startDate)} - ${fmtDate(finalEnd)}`
      };
    }

    function coverageChoices(thread) {
      const start = new Date(thread?.open_start || '');
      if (!Number.isFinite(start.getTime())) return [];
      const endCandidate = new Date(thread?.open_end || '');
      const end = Number.isFinite(endCandidate.getTime()) && endCandidate > start ? endCandidate : fallbackCoverageEnd(start);
      const firstDay = dateInputValue(start);
      const lastDay = dateInputValue(end);
      const days = [];
      const cursor = dateAtTime(firstDay, start);
      const last = dateAtTime(lastDay, start);
      while (cursor && last && cursor <= last && days.length < 7) {
        const dayText = dateInputValue(cursor);
        const dayStart = dateAtTime(dayText, start);
        const dayEnd = dateAtTime(dayText, end, start.getHours() + 2);
        days.push(normalizeCoverageWindow(dayStart, dayEnd, `${fmtDate(dayStart)} - ${fmtDate(dayEnd)}`));
        cursor.setDate(cursor.getDate() + 1);
      }
      if (days.length > 1) {
        days.push(normalizeCoverageWindow(start, end, `All listed days: ${fmtDate(start)} - ${fmtDate(end)}`));
      }
      return days.filter(Boolean);
    }

    function defaultDripSendAt(thread) {
      const base = new Date(thread?.open_end || thread?.open_start || Date.now());
      const date = Number.isFinite(base.getTime()) ? base : new Date();
      date.setDate(date.getDate() + 2);
      date.setHours(10, 0, 0, 0);
      if (date.getTime() < Date.now() + 30 * 60 * 1000) {
        date.setTime(Date.now() + 24 * 60 * 60 * 1000);
        date.setHours(10, 0, 0, 0);
      }
      return toLocalInputValue(thread?.followup_send_at || date);
    }

        || next.max_per_day > current.max_per_day
        || next.duplicate_phone_cooldown_days < current.duplicate_phone_cooldown_days
        || next.missed_open_house_max_age_days > current.missed_open_house_max_age_days
        || next.send_horizon_days > current.send_horizon_days
        || next.health_window_days < current.health_window_days
        || next.health_min_sends > current.health_min_sends
        || next.max_opt_out_rate > current.max_opt_out_rate;
    }

    async function downloadHomeKeyQr() {
      const code = state.homekeyModal?.data?.homekey?.public_code || '';
      if (!code) return;
      try {
        const response = await fetch(`/api/admin/open-house-homekey?format=png&code=${encodeURIComponent(code)}`, {
          cache: 'no-store',
          headers: authHeaders()
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || `Download failed: ${response.status}`);
        }
        const blob = await response.blob();
        const disposition = response.headers.get('content-disposition') || '';
        const filename = disposition.match(/filename="([^"]+)"/i)?.[1] || `homekey-${code}-qr.png`;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        showToast('Downloaded 1600 px HomeKey QR PNG.');
      } catch (error) {
        showToast(error.message || 'Unable to download HomeKey QR.');
      }
    }
