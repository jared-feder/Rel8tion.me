      eventPassScanner.detecting = false;
      if (eventPassScanner.stream) {
        eventPassScanner.stream.getTracks().forEach((track) => track.stop());
      }
      eventPassScanner.stream = null;
      const video = document.getElementById('eventPassScannerVideo');
      if (video) {
        video.pause();
        video.srcObject = null;
        video.classList.remove('active');
      }
      if (!silent && !eventPassScanner.submitting) {
        setEventPassScannerStatus('Camera stopped. Open it again when you are ready to scan another Event Pass.');
      }
    }

    async function ensureEventPassQrDecoder() {
      if (eventPassScanner.detector || window.jsQR) return;
      if ('BarcodeDetector' in window) {
        try {
          eventPassScanner.detector = new window.BarcodeDetector({ formats: ['qr_code'] });
          return;
        } catch (_) {}
      }
      if (!eventPassScanner.decoderPromise) {
        eventPassScanner.decoderPromise = new Promise((resolve, reject) => {
          const existing = document.querySelector('script[data-event-pass-qr-decoder]');
          if (existing) {
            existing.addEventListener('load', resolve, { once: true });
            existing.addEventListener('error', () => reject(new Error('Unable to load the QR decoder.')), { once: true });
            return;
          }
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
          script.async = true;
          script.dataset.eventPassQrDecoder = 'true';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Unable to load the QR decoder.'));
          document.head.appendChild(script);
        });
      }
      await eventPassScanner.decoderPromise;
      if (!window.jsQR) throw new Error('This browser could not start the QR decoder.');
    }

    async function detectEventPassQr(canvas) {
      if (eventPassScanner.detector) {
        const codes = await eventPassScanner.detector.detect(canvas);
        return String(codes?.[0]?.rawValue || '').trim();
      }
      if (!window.jsQR) return '';
      const context = canvas.getContext('2d', { willReadFrequently: true });
      const image = context.getImageData(0, 0, canvas.width, canvas.height);
      return String(window.jsQR(image.data, image.width, image.height, { inversionAttempts: 'attemptBoth' })?.data || '').trim();
    }

    async function freshenEventPassValue(scannedValue) {
      const value = String(scannedValue || '').trim();
      if (!value || eventPassScanner.submitting) return;
      eventPassScanner.submitting = true;
      state.actionKey = 'freshen_event_pass';
      stopEventPassScanner({ silent: true });
      setEventPassScannerStatus('Event Pass found. Clearing the old host, live event link, and Event Pass NFC owner...', 'working');
      document.querySelectorAll('[data-event-pass-scanner-action]').forEach((button) => { button.disabled = true; });
      try {
        const result = await api('/api/admin/sign-action', {
          method: 'POST',
          body: JSON.stringify({
            action: 'freshen_event_pass',
            scanned_value: value,
            source: 'admin_event_pass_scanner'
          })
        });
        const code = result.inventory_before?.public_code || result.inventory?.public_code || 'Event Pass';
        const endedCount = Array.isArray(result.ended_events) ? result.ended_events.length : 0;
        const clearedCount = Number(result.cleared_inventory_count || 1);
        state.eventPassFreshenerResult = {
          code,
          endedCount,
          clearedCount,
          nfcReset: Boolean(result.nfc_key_reset?.key),
          completedAt: new Date().toISOString()
        };
        state.actionKey = '';
        eventPassScanner.submitting = false;
        showToast(`${code} is fresh and ready for the next host.`);
        await loadAll();
      } catch (error) {
        state.actionKey = '';
        eventPassScanner.submitting = false;
        setEventPassScannerStatus(error.message || 'Unable to freshen this Event Pass.', 'bad');
        showToast(error.message || 'Unable to freshen this Event Pass.');
        document.querySelectorAll('[data-event-pass-scanner-action]').forEach((button) => { button.disabled = false; });
      }
    }

    async function scanEventPassCameraFrame() {
      if (!eventPassScanner.stream || eventPassScanner.submitting) return;
      const video = document.getElementById('eventPassScannerVideo');
      const canvas = document.getElementById('eventPassScannerCanvas');
      if (!video || !canvas) return stopEventPassScanner({ silent: true });
      if (!eventPassScanner.detecting && video.readyState >= 2 && video.videoWidth && video.videoHeight) {
        eventPassScanner.detecting = true;
        try {
          const width = Math.min(video.videoWidth, 1280);
          const height = Math.round(video.videoHeight * (width / video.videoWidth));
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0, width, height);
          const value = await detectEventPassQr(canvas);
          if (value) {
            await freshenEventPassValue(value);
            return;
          }
        } catch (error) {
          stopEventPassScanner({ silent: true });
          setEventPassScannerStatus(error.message || 'The camera could not read that QR code.', 'bad');
          return;
        } finally {
          eventPassScanner.detecting = false;
        }
      }
      if (eventPassScanner.stream) eventPassScanner.frame = window.requestAnimationFrame(scanEventPassCameraFrame);
    }

    async function startEventPassScanner() {
      if (eventPassScanner.submitting) return;
      stopEventPassScanner({ silent: true });
      setEventPassScannerStatus('Opening the rear camera...', 'working');
      try {
        await ensureEventPassQrDecoder();
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera scanning is not supported in this browser. Use QR photo or enter the code.');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        const video = document.getElementById('eventPassScannerVideo');
        if (!video) {
          stream.getTracks().forEach((track) => track.stop());
          return;
        }
        eventPassScanner.stream = stream;
        video.srcObject = stream;
        video.classList.add('active');
        await video.play();
        setEventPassScannerStatus('Point the camera at the printed Event Pass QR. It will freshen immediately after one successful scan.', 'working');
        eventPassScanner.frame = window.requestAnimationFrame(scanEventPassCameraFrame);
      } catch (error) {
        stopEventPassScanner({ silent: true });
        setEventPassScannerStatus(error.message || 'Unable to open the camera. Use QR photo or enter the printed code.', 'bad');
      }
    }

    async function scanEventPassImage(event) {
      const input = event.currentTarget;
      const file = input.files?.[0];
      if (!file || eventPassScanner.submitting) return;
      stopEventPassScanner({ silent: true });
      setEventPassScannerStatus('Reading the Event Pass QR photo...', 'working');
      try {
        await ensureEventPassQrDecoder();
        const bitmap = await window.createImageBitmap(file);
        const canvas = document.getElementById('eventPassScannerCanvas');
        const width = Math.min(bitmap.width, 1800);
        const height = Math.round(bitmap.height * (width / bitmap.width));
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d', { willReadFrequently: true }).drawImage(bitmap, 0, 0, width, height);
        bitmap.close?.();
        const value = await detectEventPassQr(canvas);
        if (!value) throw new Error('No QR code was found in that image. Try a closer, brighter photo.');
        await freshenEventPassValue(value);
      } catch (error) {
        setEventPassScannerStatus(error.message || 'Unable to read that QR image.', 'bad');
      } finally {
        input.value = '';
      }
    }

        form.addEventListener('submit', saveAgentWebsite);
      });
      document.getElementById('autoAssignLo')?.addEventListener('click', autoAssignLoanOfficers);
      document.getElementById('reportWindow')?.addEventListener('change', (event) => {
        state.reportWindow = event.target.value;
        refreshAreaContent();
      });
      document.getElementById('reportSort')?.addEventListener('change', (event) => {
        state.reportSort = event.target.value;
        refreshAreaContent();
      });
      document.getElementById('generateConfirmedPdf')?.addEventListener('click', generateConfirmedPdfReport);
      document.getElementById('buyerApply')?.addEventListener('click', applyBuyerFinderFilters);
      document.getElementById('buyerGenerateReport')?.addEventListener('click', generateBuyerFinderReport);
      document.querySelectorAll('[data-buyer-filter]').forEach((input) => {
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            applyBuyerFinderFilters();
          }
        });
      });
    }

    function renderStats() {
      const o = state.command?.overview || {};
      const inbound = state.counts.inbound || o.incoming_threads || 0;
      const needs = state.counts.needs_reply || o.needs_reply || 0;
      const cronReady = countValue(o.outreach_queue_cron_ready, o.outreach_queue_approved_ready || 0);
      const manualReady = o.outreach_queue_manual_ready || 0;
      const stats = [
        { label: 'Needs reply', value: needs, icon: 'message-square-reply', tone: needs ? 'orange' : 'green', meter: inbound ? (needs / inbound) * 100 : 4, area: 'outreach', filter: 'needs_reply' },
        { label: 'Auto ready', value: cronReady, icon: 'play-circle', tone: cronReady ? 'orange' : 'green', meter: cronReady ? Math.min(100, cronReady * 8) : 4, area: 'outreach', filter: 'all' },
        { label: 'Manual ready', value: manualReady, icon: 'hand', tone: manualReady ? 'orange' : 'green', meter: manualReady ? Math.min(100, manualReady * 8) : 4, area: 'outreach', filter: 'all' },
        { label: 'Inbound', value: inbound, icon: 'inbox', tone: 'sky', meter: inbound ? 78 : 10, area: 'outreach', filter: 'inbound' },
        { label: 'Confirmed OH', value: o.confirmed_open_houses || 0, icon: 'badge-check', tone: 'green', meter: o.confirmed_open_houses ? 82 : 8, area: 'events' },
        { label: 'Active signs', value: o.active_signs || 0, icon: 'scan-line', tone: 'violet', meter: o.active_signs ? 82 : 8, area: 'signs' },
        { label: 'Open events', value: o.open_events || 0, icon: 'calendar-days', tone: 'green', meter: o.open_events ? 72 : 8, area: 'events' },
        { label: 'Needs LO', value: o.open_events_without_lo || 0, icon: 'user-plus', tone: o.open_events_without_lo ? 'rose' : 'green', meter: o.open_events ? ((o.open_events_without_lo || 0) / o.open_events) * 100 : 6, area: 'lo' },
        { label: 'Leads', value: o.leads || 0, icon: 'contact-round', tone: 'green', meter: o.leads ? 82 : 8, area: 'leads' },
        { label: 'Check-ins', value: o.checkins || 0, icon: 'badge-check', tone: 'sky', meter: o.checkins ? 86 : 12, area: 'leads' },
        { label: 'Pay setup', value: o.payments_needing_setup || 0, icon: 'credit-card', tone: o.payments_needing_setup ? 'orange' : 'green', meter: o.payments_needing_setup ? 62 : 7, area: 'payments' }
      ];
      if (state.area !== 'outreach') {
        stats.push({ label: 'Outreach queue', value: o.outreach_queue || state.command?.outreach?.recent?.length || 0, icon: 'list-checks', tone: 'sky', meter: o.outreach_queue ? 70 : 7, area: 'outreach', filter: 'all' });
      }
      return `<section class="stats-grid">${stats.map((stat) => `
        <button type="button" class="stat-card ${esc(stat.tone)}" data-stat-area="${esc(stat.area)}"${stat.filter ? ` data-stat-filter="${esc(stat.filter)}"` : ''} aria-label="Open ${esc(stat.label)}">
          <div class="stat-top">
            <div>
              <div class="value">${esc(stat.value)}</div>
              <div class="label">${esc(stat.label)}</div>
            </div>
            <div class="stat-icon"><i data-lucide="${esc(stat.icon)}"></i></div>
          </div>
          <div class="meter"><span style="width:${Math.max(4, Math.min(100, Math.round(stat.meter)))}%"></span></div>
        </button>
      `).join('')}</section>`;
    }

    function renderArea() {
      if (state.area === 'outreachControl') return renderOutreachControl();
      if (state.area === 'leads') return renderLeads();
      if (state.area === 'crm') return renderCrm();
      if (state.area === 'buyerFinder') return renderBuyerFinder();
      if (state.area === 'events') return renderEvents();
      if (state.area === 'signs') return renderSigns();
      if (state.area === 'lo') return renderLoanOfficers();
      if (state.area === 'payments') return renderPayments();
      if (state.area === 'reports') return renderReports();
      return renderOutreach();
    }

    function buyerOption(value, label) {
      return `<option value="${esc(value)}"${state.buyerFinder.filters.sort === value ? ' selected' : ''}>${esc(label)}</option>`;
    }

    function buyerField(key, label, attrs = '') {
      const value = state.buyerFinder.filters[key] ?? '';
      return `
        <div class="finder-field">
          <label for="buyer_${esc(key)}">${esc(label)}</label>
          <input id="buyer_${esc(key)}" class="field" data-buyer-filter="${esc(key)}" value="${esc(value)}" ${attrs}>
        </div>
      `;
    }

    function renderBuyerFinderSummary() {
      const summary = state.buyerFinder.summary || {};
      const rows = state.buyerFinder.rows || [];
      const cards = [
        ['Matches', summary.total ?? rows.length],
        ['Open houses', summary.open_house_count ?? rows.filter((row) => row.open_start).length],
        ['With photos', summary.with_photo ?? rows.filter((row) => row.image).length],
        ['Avg price', money(summary.avg_price) || '-'],
        ['Price range', summary.min_price || summary.max_price ? `${money(summary.min_price) || '$0'} - ${money(summary.max_price) || 'open'}` : '-']
      ];
      return `
        <div class="finder-summary-grid">
          ${cards.map(([label, value]) => `
            <div class="finder-summary">
              <div class="mini-title">${esc(label)}</div>
              <div class="value">${esc(value)}</div>
            </div>
          `).join('')}
        </div>
      `;

    function renderBuyerFinderWarnings() {
      const warnings = state.buyerFinder.warnings || [];
      if (!warnings.length) return '';
      return `
        <div class="glass-card" style="padding:12px;">
          <div class="mini-title">Data warnings</div>
          <div class="small">${esc(warnings.map((item) => `${item.source || 'source'}: ${item.error || 'unavailable'}`).join(' | '))}</div>

    function renderBuyerFinderCard(row) {
      const openWindow = reportDisplayWindow(row.open_start, row.open_end);
      const facts = [
        money(row.price),
        row.beds ? `${row.beds} beds` : '',
        row.baths ? `${row.baths} baths` : '',
        [row.city, row.state, row.zip].filter(Boolean).join(' ')
      ].filter(Boolean);
      const agents = Array.isArray(row.listing_agents) ? row.listing_agents : [];
      return `
        <article class="glass-card finder-card">
          <div class="finder-card-media">
            ${row.image ? `<img class="report-photo" src="${esc(row.image)}" alt="${esc(row.address || 'Listing photo')}">` : `<div class="image-fallback">${esc(row.address || 'No property photo')}</div>`}
          </div>
          <div class="finder-card-body">
            <div>
              <div class="address">${esc(row.address || 'Upcoming listing')}</div>
              <div class="open-time">${esc(openWindow ? `Open house: ${openWindow}` : 'No open-house time loaded')}</div>
            </div>
            <div class="finder-facts">
              ${facts.map((fact) => `<span class="finder-fact">${esc(fact)}</span>`).join('')}
              ${row.review_status ? `<span class="finder-fact">${esc(row.review_status)}</span>` : ''}
              ${(row.source_types || []).map((source) => `<span class="finder-fact">${esc(source)}</span>`).join('')}
            </div>
            <div>
              <div class="mini-title">Listing contact</div>
              <a class="primary" href="${esc(adminAgentHref(row))}">${esc(row.agent_name || 'No agent loaded')}</a>
              <div class="secondary">${esc([row.brokerage, fmtPhone(row.agent_phone), row.agent_email].filter(Boolean).join(' | ') || 'No contact fields loaded')}</div>
            </div>
            ${agents.length ? `
              <div>
                <div class="mini-title">${esc(agents.length)} listing agent record${agents.length === 1 ? '' : 's'}</div>
                <div class="secondary">${esc(agents.slice(0, 3).map((agent) => [agent.name, agent.brokerage, fmtPhone(agent.phone), agent.email].filter(Boolean).join(' | ')).filter(Boolean).join('\n'))}</div>
              </div>
            ` : ''}
            <div class="finder-report-note">${esc(buyerFinderResultAngle(row))}</div>
            <div class="row-actions">
              ${row.listing_url ? `<a class="btn soft" href="${esc(row.listing_url)}" target="_blank" rel="noopener"><i data-lucide="external-link"></i><span>Open listing</span></a>` : ''}
              ${row.agent_phone ? `<a class="btn soft" href="tel:${esc(String(row.agent_phone).replace(/[^0-9+]/g, ''))}"><i data-lucide="phone"></i><span>Call agent</span></a>` : ''}
              ${row.agent_email ? `<a class="btn soft" href="mailto:${esc(row.agent_email)}"><i data-lucide="mail"></i><span>Email agent</span></a>` : ''}
            </div>
          </div>
        </article>
      `;
    }

    function renderBuyerFinder() {

      return `
        <div class="section-head">

            <h2>Buyer home finder</h2>

          <div class="report-toolbar">

            ${buyerField('state', 'State', 'placeholder="NY" maxlength="16"')}
            ${buyerField('brokerage', 'Brokerage', 'placeholder="Any"')}
            ${buyerField('agent', 'Agent', 'placeholder="Any"')}
            <div class="finder-field">
              <label for="buyer_sort">Sort</label>
              <select id="buyer_sort" class="select" data-buyer-filter="sort">
                ${buyerOption('open_start_asc', 'Open house soonest')}

                ${buyerOption('price_desc', 'Price high to low')}
                ${buyerOption('beds_desc', 'Most beds')}

          <div class="finder-report-note">Press Apply Search after changing filters. The dashboard will not hit the database on every keystroke.</div>

        ${finder.error ? `<div class="glass-card" style="padding:18px;font-weight:900;color:#b91c1c;">${esc(finder.error)}</div>` : ''}

        ${finder.loading ? '<div class="glass-card" style="padding:18px;font-weight:900;">Loading buyer matches...</div>' : ''}
        ${!finder.loading && finder.loaded && !rows.length ? '<div class="glass-card" style="padding:18px;font-weight:900;">No upcoming listings or open houses matched those parameters.</div>' : ''}
        <div class="finder-results">

    function renderOutreachControl() {
      const control = state.outreachControl || {};
      if (control.ok === false) {
        return `<div class="glass-card" style="padding:18px;display:grid;gap:10px;"><div class="mini-title">Outreach Control unavailable</div><div class="error small">${esc(control.error || 'Unable to load sender controls.')}</div><button class="btn soft" id="outreachControlRetry"><i data-lucide="refresh-cw"></i><span>Try again</span></button></div>`;
      }

      const guardrails = control.guardrails?.value || {};
      const stats = control.stats || {};
      const sender = control.sender || {};
      const release = control.release_window?.value || {};
      const paused = control.paused === true;
      const healthStopped = sender.health_blocked === true && sender.health_gate_override !== true;
      const sendingStopped = paused || healthStopped;
      const busy = String(state.actionKey || '').startsWith('outreach_control:');
      const rate = Number(sender.health_opt_out_rate || 0);
      const maxRate = Number(guardrails.max_opt_out_rate || 0);
      const weekCoverage = stats.week_open_houses
        ? Math.round((Number(stats.week_enriched_open_houses || 0) / Number(stats.week_open_houses)) * 100)
        : 0;
      const updatedBy = control.pause_setting?.updated_by || control.guardrails?.updated_by || 'sender configuration';

      const metric = (label, value, detail, tone = 'info') => `
        <div class="outreach-control-metric">
          <div class="mini-title">${esc(label)}</div>
          <strong>${esc(value)}</strong>
          <div class="small">${esc(detail)}</div>
          <div style="margin-top:8px;">${badge(tone === 'bad' ? 'Needs attention' : tone === 'ok' ? 'Healthy' : 'Live', tone)}</div>
        </div>
      `;
      const field = (id, label, value, attrs, help) => `
        <div class="outreach-control-field">
          <label for="${id}">${esc(label)}</label>
          <input id="${id}" class="field" type="number" value="${esc(value)}" ${attrs}>
          <div class="small">${esc(help)}</div>
        </div>
      `;

      return `
        <div class="section-head">
          <div>
            <h2>Outreach Control</h2>
            <div class="sub">One protected control surface for sender state, live guardrails, queue volume, and outreach health.</div>
          </div>
          <div class="header-actions">
            ${badge(sendingStopped ? 'SENDING STOPPED' : 'SENDING ALLOWED', sendingStopped ? 'bad' : 'ok')}
            ${sender.health_gate_override ? badge('HEALTH OVERRIDE ACTIVE', 'warn') : ''}
            ${renderOutreachModeControls()}
          </div>
        </div>

        <div class="outreach-control-grid">
          <section class="glass-card" style="padding:18px;display:grid;gap:14px;">
            <div class="reply-footer">
              <div>
                <div class="mini-title">Master sender switch</div>
                <div class="address">${paused ? 'Automatic outreach is stopped' : healthStopped ? 'Health stop is blocking outreach' : 'Automatic outreach is allowed'}</div>
                <div class="small">${paused
                  ? `Paused ${control.pause_setting?.updated_at ? fmtDate(control.pause_setting.updated_at) : ''} by ${updatedBy}. Cron can still inspect rows but cannot send.`
                  : healthStopped
                    ? `The rolling opt-out rate is at or above the configured ${Math.round(maxRate * 10000) / 100}% threshold.`
                    : 'The next cron run may send eligible rows within the limits below.'}</div>
              </div>
              <div class="row-actions">
                <button class="btn bad" id="outreachStopAll" ${busy || paused ? 'disabled' : ''}><i data-lucide="circle-stop"></i><span>${state.actionKey === 'outreach_control:pause' ? 'Stopping...' : 'Stop outreach'}</span></button>
                <button class="btn primary" id="outreachStartAll" ${busy || !paused ? 'disabled' : ''}><i data-lucide="circle-play"></i><span>${state.actionKey === 'outreach_control:resume' ? 'Starting...' : 'Start outreach'}</span></button>
              </div>
            </div>
            <div class="small">Start does not bypass health, volume, quiet-hour, readiness, duplicate-recipient, phone-validity, or STOP protections.</div>
          </section>

          <section class="glass-card" style="padding:18px;display:grid;gap:14px;">
            <div class="reply-footer">
              <div><div class="mini-title">Current outreach stats</div><div class="small">Live sender diagnostic plus exact database counts.</div></div>
              ${badge(control.loaded_at ? `Updated ${fmtDate(control.loaded_at)}` : 'Loading', 'info')}
            </div>
            <div class="outreach-control-metrics">
              ${metric('Current opt-out rate', `${(rate * 100).toFixed(2)}%`, `${sender.health_opt_outs || 0} opt-outs / ${sender.health_outreach_sends || 0} sends in ${guardrails.health_window_days || 7} days · stop at ${(maxRate * 100).toFixed(2)}%`, sender.health_blocked ? 'bad' : 'ok')}
              ${metric('Messages pending', stats.queue_pending || 0, `${stats.queue_automatic_due || 0} automatic rows are due now`, stats.queue_pending ? 'info' : 'warn')}
              ${metric('Open houses enriched', stats.week_enriched_open_houses || 0, `${weekCoverage}% of ${stats.week_open_houses || 0} open houses scheduled this week`, weekCoverage >= 75 ? 'ok' : weekCoverage ? 'warn' : 'bad')}
              ${metric('Priority window', `${guardrails.send_horizon_days || 7} days`, 'Future open houses only · soonest date/time first', 'ok')}
              ${metric('Sent last hour', sender.recent_outreach_sends_1h || 0, `${sender.hourly_remaining ?? guardrails.max_per_hour ?? 0} remaining under the hourly cap`, 'info')}
              ${metric('Sent last 24 hours', sender.recent_outreach_sends_24h || 0, `${sender.daily_remaining ?? guardrails.max_per_day ?? 0} remaining under the 24-hour cap`, 'info')}
              ${metric('Queue inventory', stats.queue_total || 0, `${stats.queue_manual_hold || 0} manual/held · ${stats.queue_blocked_or_failed || 0} blocked or failed`, 'info')}
            </div>
          </section>

          <section class="glass-card" style="padding:18px;display:grid;gap:14px;">
            <div class="reply-footer">
              <div>
                <div class="mini-title">Editable sender guardrails</div>
                <div class="small">Runtime values take effect on the next sender run. Volume fields cannot exceed the code hard caps.</div>
              </div>
              ${badge(control.guardrails?.source === 'runtime' ? 'COMMAND runtime' : 'Sender environment', control.guardrails?.source === 'runtime' ? 'ok' : 'info')}
            </div>
            <div class="outreach-control-form">
              ${field('guardrailMaxPerRun', 'Maximum per run', guardrails.max_per_run || 7, 'min="1" max="7" step="1"', 'Hard cap: 7 messages per cron run.')}
              ${field('guardrailMaxPerHour', 'Maximum per hour', guardrails.max_per_hour || 20, 'min="1" max="20" step="1"', 'Rolling 60-minute maximum; hard cap 20.')}
              ${field('guardrailMaxPerDay', 'Maximum per 24 hours', guardrails.max_per_day || 150, 'min="1" max="150" step="1"', 'Rolling 24-hour maximum; hard cap 150.')}
              ${field('guardrailCooldownDays', 'Same-phone cooldown days', guardrails.duplicate_phone_cooldown_days || 30, 'min="1" max="365" step="1"', 'Blocks another initial outreach to the same normalized phone.')}
              ${field('guardrailMissedAgeDays', 'Missed-event max age days', guardrails.missed_open_house_max_age_days || 7, 'min="1" max="30" step="1"', 'Maximum age for any missed-open-house recovery copy.')}
              ${field('guardrailSendHorizonDays', 'Upcoming send horizon days', guardrails.send_horizon_days || 7, 'min="1" max="21" step="1"', 'Only future open houses inside this rolling window are eligible; soonest date/time goes first.')}
              ${field('guardrailHealthWindowDays', 'Health window days', guardrails.health_window_days || 7, 'min="1" max="30" step="1"', 'Rolling window used for opt-out health.')}
              ${field('guardrailHealthMinSends', 'Minimum sends before stop', guardrails.health_min_sends || 20, 'min="1" max="1000" step="1"', 'Health stop activates only after this sample size.')}
              ${field('guardrailMaxOptOutPercent', 'Maximum opt-out rate (%)', Number(guardrails.max_opt_out_rate || .05) * 100, 'min="0.1" max="100" step="0.1"', 'At or above this rate, automatic sending stops.')}
            </div>
            <div class="reply-footer">
              <div class="small">Less restrictive changes require typing REL8TION. Updated ${control.guardrails?.updated_at ? fmtDate(control.guardrails.updated_at) : 'from sender environment'}${control.guardrails?.updated_by ? ` by ${esc(control.guardrails.updated_by)}` : ''}.</div>
              <button class="btn primary" id="saveOutreachGuardrails" ${busy ? 'disabled' : ''}><i data-lucide="save"></i><span>${state.actionKey === 'outreach_control:guardrails' ? 'Saving...' : 'Save guardrails'}</span></button>
            </div>
          </section>

          <section class="glass-card" style="padding:18px;display:grid;gap:14px;">
            <div class="reply-footer">
              <div>
                <div class="mini-title">Bounded health override window</div>
                <div class="small">Advanced control: limits eligible event dates and temporarily bypasses only the rolling opt-out health stop.</div>
              </div>
              ${badge(control.release_window?.active ? 'ACTIVE' : release.enabled ? 'CONFIGURED / INACTIVE' : 'OFF', control.release_window?.active ? 'warn' : 'info')}
            </div>
            <label class="btn soft" style="justify-content:flex-start;"><input id="releaseWindowEnabled" type="checkbox" ${release.enabled ? 'checked' : ''}><span>Enable bounded health override</span></label>
            <div class="outreach-control-form">
              <div class="outreach-control-field"><label for="releaseWindowFrom">Event date from (optional)</label><input id="releaseWindowFrom" class="field" type="datetime-local" value="${esc(localDateTimeValue(release.from_open_start))}"><div class="small">Inclusive lower bound for open_start.</div></div>
              <div class="outreach-control-field"><label for="releaseWindowThrough">Event date through</label><input id="releaseWindowThrough" class="field" type="datetime-local" value="${esc(localDateTimeValue(release.through_open_start))}"><div class="small">Exclusive upper bound; must be in the future.</div></div>
              <div class="outreach-control-field"><label for="releaseWindowExpires">Override expires</label><input id="releaseWindowExpires" class="field" type="datetime-local" value="${esc(localDateTimeValue(release.expires_at))}"><div class="small">Automatic fail-closed expiration.</div></div>
              <div class="outreach-control-field"><label for="releaseWindowReason">Reason</label><input id="releaseWindowReason" class="field" maxlength="240" value="${esc(release.reason || '')}" placeholder="Owner-approved release scope"><div class="small">Stored with the runtime setting for operator context.</div></div>
            </div>
            <div class="reply-footer">
              <div class="small">A global pause always wins. This override never bypasses STOP suppression, cooldown, volume limits, quiet hours, phone validity, or readiness checks.</div>
              <button class="btn ${release.enabled ? 'bad' : 'soft'}" id="saveOutreachReleaseWindow" ${busy ? 'disabled' : ''}><i data-lucide="shield-alert"></i><span>${state.actionKey === 'outreach_control:release' ? 'Saving...' : release.enabled ? 'Update override' : 'Save override setting'}</span></button>
            </div>
          </section>

          <section class="glass-card" style="padding:18px;display:grid;gap:12px;">
            <div><div class="mini-title">Locked recipient protections</div><div class="small">These safeguards are visible here but cannot be disabled from COMMAND.</div></div>
            <div class="outreach-protection-list">
              ${(control.locked_protections || []).map((item) => `<div class="outreach-protection"><i data-lucide="shield-check"></i><span>${esc(item)}</span></div>`).join('')}
            </div>
            ${(control.warnings || []).length ? `<div class="error small">${esc(control.warnings.join(' | '))}</div>` : ''}
          </section>
        </div>
      `;
    }

    function renderOutreach() {
      const matchingRows = filteredInbox();
      const rows = matchingRows.slice(0, state.outreachThreadLimit);
      const latestInbound = latestInboundThreads(8);
      const cronReady = countValue(state.command?.overview?.outreach_queue_cron_ready, state.command?.overview?.outreach_queue_approved_ready || 0);
      const paused = state.command?.overview?.outreach_queue_paused || 0;
      const twilioReady = state.command?.overview?.outreach_queue_twilio_ready || 0;
      const manualReady = state.command?.overview?.outreach_queue_manual_ready || 0;
      const autoReady = state.command?.overview?.outreach_queue_auto_ready ?? state.command?.overview?.outreach_queue_android_ready ?? 0;
      const operatorMode = outreachOperatorMode();
      return `
        <div class="section-head">
          <div>
            <h2>Outreach command</h2>
            <div class="sub">${matchingRows.length} conversations in this view | showing ${rows.length} | ${esc(state.counts.inbound || 0)} inbound | ${esc(state.counts.needs_reply || 0)} need reply | mode ${esc(operatorMode)} | ${esc(twilioReady)} Twilio | ${esc(manualReady)} manual | ${esc(autoReady)} auto | ${esc(paused)} paused</div>
          </div>
          <div class="header-actions">
            ${renderOutreachModeControls()}
            <a class="btn primary" href="/manual-sms-outreach">
              <i data-lucide="smartphone"></i><span>Manual SMS Backup</span>
            </a>
            <button class="btn soft" id="replayAndroidInbox" ${state.actionKey === 'android_replay' ? 'disabled' : ''}>
              <i data-lucide="rotate-cw"></i><span>${state.actionKey === 'android_replay' ? 'Replaying...' : 'Replay Android inbox'}</span>
            </button>
            <select id="outreachFilter" class="select" style="max-width:220px;">
              <option value="needs_reply"${state.outreachFilter === 'needs_reply' ? ' selected' : ''}>Needs reply</option>
              <option value="interested"${state.outreachFilter === 'interested' ? ' selected' : ''}>Interested / yes</option>
              <option value="inbound"${state.outreachFilter === 'inbound' ? ' selected' : ''}>Inbound</option>
              <option value="all"${state.outreachFilter === 'all' ? ' selected' : ''}>All threads</option>
              <option value="opt_out"${state.outreachFilter === 'opt_out' ? ' selected' : ''}>Opt-outs</option>
            </select>
          </div>
        </div>
        ${renderOutreachHealth()}
        ${renderLatestInboundReplies(latestInbound)}
        ${renderOutreachSearchMatches()}
        <div class="outreach-grid">
          ${state.loading ? '<div class="glass-card" style="padding:18px;font-weight:900;">Loading...</div>' : ''}
          ${!state.loading && rows.length === 0 ? '<div class="glass-card" style="padding:18px;font-weight:900;">No conversations in this view.</div>' : ''}
          ${rows.map(renderOutreachCard).join('')}
        </div>
        ${rows.length < matchingRows.length ? `<div class="row-actions" style="margin:16px 0 24px;"><button class="btn soft" id="outreachShowMore"><i data-lucide="chevrons-down"></i><span>Show 40 more conversations</span></button>${badge(`${rows.length} of ${matchingRows.length}`, 'info')}</div>` : ''}
        ${renderOutreachQueue()}
      `;
    }

    function renderOutreachSearchMatches() {
      const query = state.query.trim();
      if (!query) return '';
      const rows = outreachQueueSearchMatches(12);
      const serverSearch = state.outreachSearch || {};
      const searchStatus = serverSearch.loading
        ? badge('Searching database', 'info')
        : serverSearch.error
          ? badge(serverSearch.error, 'warn')
          : serverSearch.query === query
            ? badge(`${serverSearch.rows?.length || 0} database${serverSearch.warnings?.length ? ' partial' : ''}`, serverSearch.warnings?.length ? 'warn' : (serverSearch.rows || []).length ? 'ok' : 'warn')
            : badge('Local slice', 'info');
      return `
        <div class="glass-card" style="padding:14px; display:grid; gap:10px;">
          <div class="reply-footer">
            <div>
              <div class="mini-title">Database matches for "${esc(query)}"</div>
              <div class="small">Searches the full outreach queue, not just the currently loaded dashboard slice.</div>
            </div>
            ${searchStatus}
          </div>
          <div class="rows">
            ${rows.length ? rows.map(renderOutreachSearchRow).join('') : '<div class="data-row"><div class="primary">No outreach records matched this search.</div><div class="secondary">Try phone, agent name, address, open-house id, or outreach code.</div><div></div><div></div><div></div></div>'}
          </div>
        </div>
      `;
    }

    function renderOutreachSearchRow(row) {
      const thread = queueRowToThread(row);
      const key = thread.thread_key;
      const listingOnly = row.search_result_type === 'listing_agent';
      const optedOut = isOptOutThread(thread);
      const confirmed = row.review_status === 'confirmed_open_house' || row.review_status === 'accepted_open_house';
      const confirmBusy = state.actionKey === actionId('confirm_open_house', key);
      const markBusy = state.actionKey === actionId('mark_interested', key);
      const pinned = agentIsPinned(thread);
      const pinBusy = state.actionKey === actionId(pinned ? 'unpin_agent' : 'pin_agent', key);
      const followUpMarked = agentNeedsFollowUp(thread);
      const followUpBusy = state.actionKey === actionId(followUpMarked ? 'clear_agent_follow_up' : 'mark_agent_follow_up', key);
      const confirmLabel = confirmed ? 'Update date' : 'Confirm OH';
      return `
        <div class="data-row">
          <div>
            <a class="primary" href="${esc(adminAgentHref(row))}">${esc(row.agent_name || 'Unknown agent')}</a>
            <div class="secondary">${esc([row.brokerage, fmtPhone(row.agent_phone)].filter(Boolean).join(' | '))}</div>
          </div>
          <div>
            <div class="primary">${esc(row.address || row.open_house_id || 'No property')}</div>
            <div class="secondary">${esc([fmtDate(row.open_start), money(row.price)].filter(Boolean).join(' | '))}</div>
          </div>
          <div>${badge(listingOnly ? 'listing feed' : row.review_status || 'pending', confirmed ? 'ok' : optedOut ? 'bad' : listingOnly ? 'warn' : 'info')}</div>
          <div class="badges">
            ${badge(listingOnly ? 'not queued' : row.initial_send_status || 'not sent', row.initial_sent_at ? 'ok' : 'warn')}
            ${listingOnly ? '' : sendApprovalBadge(thread)}
            ${row.initial_sent_at ? badge(fmtDate(row.initial_sent_at), 'info') : ''}
          </div>
          <div>
            ${listingOnly ? `
              <div class="row-actions">
                <button class="btn soft" disabled>
                  <i data-lucide="list-search"></i><span>Listing agent</span>
                </button>
              </div>
            ` : `
              <div class="row-actions">
                ${sendApprovalControls(thread, key)}
                <button class="btn soft" data-mark-interested="${esc(key)}" ${optedOut || markBusy ? 'disabled' : ''}>
                  <i data-lucide="thumbs-up"></i><span>${markBusy ? 'Marking...' : 'Interested'}</span>
                </button>
                <button class="btn ${pinned ? 'primary' : 'soft'}" data-toggle-agent-pin="${esc(key)}" ${pinBusy ? 'disabled' : ''}>
                  <i data-lucide="pin"></i><span>${pinBusy ? 'Saving...' : pinned ? 'Pinned' : 'Pin to top'}</span>
                </button>
                <button class="btn ${followUpMarked ? 'primary' : 'soft'}" data-toggle-agent-follow-up="${esc(key)}" ${followUpBusy ? 'disabled' : ''}>
                  <i data-lucide="bell-ring"></i><span>${followUpBusy ? 'Saving...' : followUpMarked ? 'Follow-up marked' : 'Mark follow-up'}</span>
                </button>
                <button class="btn primary" data-confirm-open-house="${esc(key)}" ${optedOut || confirmBusy ? 'disabled' : ''}>
                  <i data-lucide="badge-check"></i><span>${confirmBusy ? 'Saving...' : confirmLabel}</span>
                </button>
              </div>
            `}
            <div class="secondary" style="margin-top:6px;">${esc(row.report_note || row.selected_sms || 'No outreach copy stored.')}</div>
          </div>
        </div>
      `;
    }

    function renderOutreachHealth() {
      const health = state.health || {};
      const checks = Array.isArray(health.checks) ? health.checks : [];
      const counts = health.counts || {};
      const status = health.status || (health.ok === false ? 'bad' : 'warn');
      return `
        <div class="glass-card" style="padding:14px; display:grid; gap:10px;">
          <div class="reply-footer">
            <div>
              <div class="mini-title">Outreach health</div>
              <div class="small">${health.ok === false ? esc(health.error || 'Health check failed.') : esc(`${counts.linked_inbox || 0} linked inbound visible | ${counts.needs_reply || 0} need reply | ${counts.linked_replies || 0} linked replies | ${counts.unlinked_android_inbound || 0} raw Android unlinked`)}</div>
            </div>
            ${badge(status.toUpperCase(), healthTone(status))}
          </div>
          ${checks.length ? `
            <div class="badges">
              ${checks.map((item) => badge(`${item.label}: ${item.status}`, healthTone(item.status))).join('')}
            </div>
          ` : ''}
          ${status !== 'ok' ? `<div class="small">${esc(checks.find((item) => item.status === 'bad')?.message || checks.find((item) => item.status === 'warn')?.message || 'Outreach health needs attention.')}</div>` : ''}
        </div>
      `;
    }

    function renderOutreachModeControls() {
      const mode = outreachOperatorMode();
      const busy = String(state.actionKey || '').startsWith('outreach_mode:');
      return `
        <div class="row-actions">
          <button class="btn ${mode === 'live' ? 'primary' : 'soft'}" data-outreach-mode="live" ${busy || mode === 'live' ? 'disabled' : ''}>
            <i data-lucide="hand"></i><span>${busy && state.actionKey === 'outreach_mode:live' ? 'Switching...' : 'Live: manual'}</span>
          </button>
          <button class="btn ${mode === 'away' ? 'primary' : 'soft'}" data-outreach-mode="away" ${busy || mode === 'away' ? 'disabled' : ''}>
            <i data-lucide="send"></i><span>${busy && state.actionKey === 'outreach_mode:away' ? 'Switching...' : 'Away: auto'}</span>
          </button>
        </div>
      `;
    }

    function renderLatestInboundReplies(rows) {
      return `
        <div class="glass-card" style="padding:14px; display:grid; gap:10px;">
          <div class="reply-footer">
            <div>
              <div class="mini-title">Latest incoming replies</div>
              <div class="small">Fresh agent replies from Android/Twilio, including raw Android rows that have not linked yet.</div>
            </div>
            ${badge(`${rows.length} shown`, rows.length ? 'ok' : 'warn')}
          </div>
          <div class="rows">
            ${rows.length ? rows.map((thread) => `
              <div class="data-row">
                <div>
                  <a class="primary" href="${esc(adminAgentHref(thread))}">${esc(thread.agent_name || fmtPhone(thread.from_phone) || 'Unknown agent')}</a>
                  <div class="secondary">${esc([thread.brokerage, fmtPhone(thread.agent_phone || thread.from_phone)].filter(Boolean).join(' | '))}</div>
                </div>
                <div>
                  <div class="primary">${esc(thread.address || 'No property')}</div>
                  <div class="secondary">${esc(fmtDate(thread.open_start) || '')}</div>
                </div>
                <div class="badges">${statusBadge(thread)}${thread.raw_inbound_only ? badge('Raw Android', 'warn') : thread.raw_inbound ? badge('Android raw', 'info') : ''}</div>
                <div>${badge(fmtDate(thread.last_reply_at) || 'new', 'info')}</div>
                <div>
                  <div class="secondary">${esc(thread.latest_reply_body || 'No reply text loaded.')}</div>
                </div>
              </div>
            `).join('') : '<div class="data-row"><div class="primary">No linked incoming replies loaded.</div><div class="secondary">Use Refresh after a new text comes in.</div><div></div><div></div><div></div></div>'}
          </div>
        </div>
      `;
    }

    function renderOutreachQueue() {
      const rows = filterByQuery(state.command?.outreach?.recent || []);
      const pendingCount = state.command?.overview?.outreach_queue_pending || 0;
      const cronReady = countValue(state.command?.overview?.outreach_queue_cron_ready, state.command?.overview?.outreach_queue_approved_ready || 0);
      const twilioReady = state.command?.overview?.outreach_queue_twilio_ready || 0;
      const manualReady = state.command?.overview?.outreach_queue_manual_ready || 0;
      const autoReady = state.command?.overview?.outreach_queue_auto_ready ?? state.command?.overview?.outreach_queue_android_ready ?? 0;
      const paused = state.command?.overview?.outreach_queue_paused || 0;
      const totalCount = state.command?.overview?.outreach_queue || rows.length;
      const shownCount = Math.min(rows.length, 80);
      return renderRows('Outreach queue reference', `${shownCount} recent records shown | ${pendingCount} pending initial send | ${cronReady} auto ready | ${twilioReady} Twilio | ${manualReady} manual | ${autoReady} automatic | ${paused} paused | ${totalCount} total`, rows.slice(0, 80), (row) => {
        const thread = queueRowToThread(row);
        const key = thread.thread_key;
        return `
          <div>
            <a class="primary" href="${esc(adminAgentHref(row))}">${esc(row.agent_name || 'Unknown agent')}</a>
            <div class="secondary">${esc([row.brokerage, fmtPhone(row.agent_phone)].filter(Boolean).join(' | '))}</div>
          </div>
          <div>
            <div class="primary">${esc(row.address || row.open_house_id || 'No property')}</div>
            <div class="secondary">${esc([fmtDate(row.open_start), money(row.price)].filter(Boolean).join(' | '))}</div>
          </div>
          <div>${badge(row.review_status || 'pending', row.review_status === 'accepted_open_house' || row.review_status === 'confirmed_open_house' ? 'ok' : 'info')}</div>
          <div class="badges">
            ${badge(row.initial_send_status || 'not sent', row.initial_sent_at ? 'ok' : 'warn')}
            ${sendApprovalBadge(thread)}
            ${deliveryBadge(row, 'initial')}
          </div>
          <div>
            <div class="row-actions">${sendApprovalControls(thread, key)}</div>
            <div class="secondary" style="margin-top:6px;">${esc(row.selected_sms || 'No outreach copy stored.')}</div>
          </div>
        `;
      });
    }

    function renderReportNoteEditor(queueId, value = '', updatedAt = '') {
      if (!queueId) return '';
      const busy = state.actionKey === actionId('save_report_note', queueId);
      return `
        <div class="mini-panel reply-box">
          <div class="reply-footer">
            <div>
              <div class="mini-title">Report note</div>
              <div class="small">Use this for missing/manual replies or open-house context that should print in reports.</div>
            </div>
            ${updatedAt ? badge(`Updated ${fmtDate(updatedAt)}`, 'info') : badge('Report visible', 'info')}
          </div>
          <textarea id="report_note_${domId(queueId)}" maxlength="1800" placeholder="Example: Ruth replied that she is interested but the SMS webhook missed it.">${esc(value || '')}</textarea>
          <div class="reply-footer">
            <button class="btn primary" data-save-report-note="${esc(queueId)}" ${busy ? 'disabled' : ''}>
              <i data-lucide="notebook-pen"></i><span>${busy ? 'Saving...' : 'Save note'}</span>
            </button>
            <span class="small">Shows on the report card and PDF-style report.</span>
          </div>
        </div>
      `;
    }

    function renderOutreachCard(thread) {
      const key = thread.thread_key;
      const media = thread.mockup_image_url || thread.listing_photo_url || '';
      const draft = state.drafts[key] || '';
      const disabledReason = isOptOutThread(thread)
        ? 'Opted out'
        : !thread.queue_row_id
          ? 'No linked queue row'
          : '';
      const canSend = !disabledReason && state.sendingKey !== key;
      const messages = Array.isArray(thread.messages) ? thread.messages : [];
      const phone = fmtPhone(thread.agent_phone || thread.from_phone);

      return `
        <article class="outreach-card">
          <div class="outreach-main">
            <div class="media-col">
              ${media ? `<img class="listing-img" src="${esc(media)}" alt="${esc(thread.address || 'Outreach mockup')}">` : `<div class="image-fallback">${esc(thread.address || 'No image')}</div>`}
              <div class="agent-strip">
                ${thread.agent_photo_url ? `<img class="avatar" src="${esc(thread.agent_photo_url)}" alt="${esc(thread.agent_name || 'Agent')}">` : `<div class="avatar-fallback">${esc(initials(thread.agent_name))}</div>`}
                <div>
                  <a class="agent-name" href="${esc(adminAgentHref(thread))}">${esc(thread.agent_name || 'Unknown agent')}</a>
                  <div class="agent-meta">${esc(thread.brokerage || 'No brokerage')}</div>
                </div>
              </div>
              <div class="badges">
                ${statusBadge(thread)}
                ${thread.raw_inbound_only ? badge('Raw Android unlinked', 'warn') : thread.raw_inbound ? badge('Android raw', 'info') : ''}
                ${thread.template_key ? badge(thread.template_key.replace(/_/g, ' '), 'info') : ''}
                ${deliveryBadge(thread, 'initial')}
                ${thread.followup_sent_at ? deliveryBadge(thread, 'followup') : ''}
              </div>
            </div>

            <div class="card-body">
              <div class="card-top">
                <div>
                  <div class="address">${esc(thread.address || 'No address')}</div>
                  <div class="open-time">${esc([fmtDate(thread.open_start), money(thread.price), phone].filter(Boolean).join(' | '))}</div>
                </div>
                ${thread.last_reply_at ? badge(fmtDate(thread.last_reply_at), 'info') : ''}
              </div>

              <div class="mini-panel">
                <div class="mini-title">My outreach</div>
                <div class="copy-body">${esc(thread.selected_sms || 'No initial outreach copy stored.')}</div>
              </div>

              <div class="mini-panel">
                <div class="mini-title">Conversation</div>
                <div class="message-list">
                  ${messages.length ? messages.map(renderMessage).join('') : `<div class="msg"><div class="msg-body">${esc(thread.latest_reply_body || 'No messages loaded.')}</div></div>`}
                </div>
              </div>

              ${renderReportNoteEditor(thread.queue_row_id, thread.report_note, thread.report_note_updated_at)}

              ${renderOutreachActions(thread)}

              <div class="mini-panel reply-box">
                <div class="mini-title">Reply by SMS</div>
                <textarea id="reply_${domId(key)}" data-draft-key="${esc(key)}" ${canSend ? '' : 'disabled'} maxlength="1200" placeholder="${disabledReason ? esc(disabledReason) : 'Write reply'}">${esc(draft)}</textarea>
                <div class="reply-footer">
                  <button class="btn primary" data-send-key="${esc(key)}" ${canSend ? '' : 'disabled'}>
                    <i data-lucide="send"></i><span>${state.sendingKey === key ? 'Sending...' : 'Send SMS'}</span>
                  </button>
                  <span id="count_${domId(key)}" class="small">${draft.length} characters</span>
                  ${disabledReason ? badge(disabledReason, 'bad') : ''}
                </div>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderAcceptedSummary(thread) {
      const assignment = outreachAssignment(thread);
      const show = assignment.visit || assignment.report || thread.review_status === 'accepted_open_house' || thread.review_status === 'confirmed_open_house';
      if (!show) return '';
      const accepted = thread.review_status === 'accepted_open_house' || Boolean(assignment.participant);
      const statusText = accepted ? 'Accepted open house' : 'Confirmed open house';
      const acceptedLabel = accepted ? 'Accepted' : 'Confirmed';
      const coverage = [fmtDate(assignment.scheduledStart), fmtDate(assignment.scheduledEnd)].filter(Boolean).join(' - ') || 'No coverage time stored';
      const acceptedAt = fmtDate(assignment.acceptedAt) || 'Time not recorded';
      const officer = assignment.assignedName || 'No loan officer assigned';
      const officerMeta = [assignment.assignedCompany, fmtPhone(assignment.assignedPhone)].filter(Boolean).join(' | ');
      return `
        <div class="accepted-summary">
          <div class="reply-footer">
            <div>
              <div class="mini-title">${esc(statusText)}</div>
              <div class="small">${assignment.assignedName ? 'LO assignment is active on this field visit.' : 'Assign or reassign the loan officer below.'}</div>
            </div>
            ${badge(accepted ? 'Accepted' : 'Confirmed', 'ok')}
          </div>
          <div class="accepted-summary-grid">
            <div class="accepted-summary-item">
              <div class="mini-title">Coverage</div>
              <strong>${esc(coverage)}</strong>
            </div>
            <div class="accepted-summary-item">
              <div class="mini-title">${esc(acceptedLabel)}</div>
              <strong>${esc(acceptedAt)}</strong>
            </div>
            <div class="accepted-summary-item">
              <div class="mini-title">Loan officer</div>
              <strong>${esc(officer)}</strong>
              ${officerMeta ? `<div class="small">${esc(officerMeta)}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderOutreachActions(thread) {
      const key = thread.thread_key;
      const profiles = activeLoanOfficers();
      const assignment = outreachAssignment(thread);
      const disabled = isOptOutThread(thread) || !thread.queue_row_id;
      const interested = isInterestedThread(thread);
      const markBusy = state.actionKey === actionId('mark_interested', key);
      const confirmBusy = state.actionKey === actionId('confirm_open_house', key);
      const acceptBusy = state.actionKey === actionId('accept_open_house', key);
      const dripBusy = state.actionKey === actionId('schedule_drip', key);
      const pinned = agentIsPinned(thread);
      const pinBusy = state.actionKey === actionId(pinned ? 'unpin_agent' : 'pin_agent', key);
      const followUpMarked = agentNeedsFollowUp(thread);
      const followUpBusy = state.actionKey === actionId(followUpMarked ? 'clear_agent_follow_up' : 'mark_agent_follow_up', key);
      const hasVisit = Boolean(assignment.visit || assignment.report);
      const accepted = thread.review_status === 'accepted_open_house' || Boolean(assignment.participant);
      const confirmed = thread.review_status === 'confirmed_open_house' || (hasVisit && !accepted);
      const acceptDisabled = disabled || acceptBusy || (accepted && !profiles.length);
      const assignedIsActive = profiles.some((profile) => profile.uid === assignment.assignedUid);
      const selectedUid = assignedIsActive ? assignment.assignedUid : profiles[0]?.uid || '';
      const confirmLabel = accepted || confirmed || hasVisit ? 'Update date' : 'Confirm true OH';
      const dripText = thread.followup_sms || defaultDripText(thread);
      const dripAt = defaultDripSendAt(thread);
      const dripDisabled = disabled || dripBusy || OUTREACH_FOLLOWUPS_DISABLED;
      const dripLabel = OUTREACH_FOLLOWUPS_DISABLED ? 'Follow-ups off' : dripBusy ? 'Scheduling...' : 'Schedule drip';
      return `
        <div class="mini-panel action-panel">
          <div class="reply-footer">
            <div>
              <div class="mini-title">Open house workflow</div>
              <div class="small">${interested ? 'Reply looks positive or was marked interested.' : 'Use these controls when an agent says yes.'}</div>
            </div>
            <div class="row-actions">
              <button class="btn ${pinned ? 'primary' : 'soft'}" data-toggle-agent-pin="${esc(key)}" ${pinBusy ? 'disabled' : ''}>
                <i data-lucide="pin"></i><span>${pinBusy ? 'Saving...' : pinned ? 'Pinned to top' : 'Pin to top'}</span>
              </button>
              <button class="btn ${followUpMarked ? 'primary' : 'soft'}" data-toggle-agent-follow-up="${esc(key)}" ${followUpBusy ? 'disabled' : ''}>
                <i data-lucide="bell-ring"></i><span>${followUpBusy ? 'Saving...' : followUpMarked ? 'Follow-up marked' : 'Mark follow-up'}</span>
              </button>
              <button class="btn soft" data-mark-interested="${esc(key)}" ${disabled || markBusy ? 'disabled' : ''}>
                <i data-lucide="thumbs-up"></i><span>${markBusy ? 'Marking...' : 'Mark interested'}</span>
              </button>
            </div>
          </div>
          ${renderAcceptedSummary(thread)}

    function agentConversationThread(row, openHouse = null) {
      const threads = Array.isArray(row?.outreach_threads) ? row.outreach_threads : [];
      const wantedQueueId = String(openHouse?.queue_row_id || '');
      const source = threads.find((thread) => wantedQueueId && String(thread.id) === wantedQueueId) || threads[0] || null;
      if (!source?.id) return null;
      return findThread(queueThreadKey({ id: source.id })) || {
        ...source,
        thread_key: queueThreadKey({ id: source.id }),
        queue_row_id: source.id,
        agent_name: row.name,
        agent_phone: row.phone,
        agent_phone_normalized: row.phone_normalized,
        agent_email: row.email,
        agent_photo_url: row.image_url,
        brokerage: row.brokerage,
        selected_sms: source.body || '',
        messages: []
      };
    }

      const thread = agentConversationThread(row, openHouse);

      const mediaUrl = openHouse?.outreach_image_url || '';
      const mediaReady = Boolean(mediaSource && mediaId && mediaUrl && openHouse?.outreach_image_status === 'rendered');

      const includePhoto = Boolean(mediaReady && selectedPhoto?.source === mediaSource && selectedPhoto?.id === mediaId);

        <section id="agent-message" class="glass-card" style="padding:18px;display:grid;gap:14px;outline:2px solid rgba(56,189,248,.38);">

              <div class="primary" style="margin-top:5px;">${esc(openHouse?.address || 'Agent conversation')}</div>

          </div>
          <div class="mini-panel">
            <div class="mini-title">Stored REL8TION conversation</div>
            <div class="copy-body">${esc(preview || 'No previous message preview is stored for this agent.')}</div>
            <div class="badges" style="margin-top:8px;">
              ${thread ? statusBadge(thread) : badge('No linked outreach thread', 'warn')}

          ${thread?.queue_row_id ? `

              ${includePhoto ? `<div style="display:flex;align-items:center;gap:10px;"><img src="${esc(mediaUrl)}" alt="Outreach photo for ${esc(openHouse?.address || 'this property')}" style="width:72px;height:72px;border-radius:12px;object-fit:cover;"><span class="secondary">This property photo will be attached as MMS.</span></div>` : ''}

    async function saveAgentWebsite(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const websiteId = form.dataset.websiteForm;
      const fields = {};
      form.querySelectorAll('[data-website-field]').forEach((input) => {
        fields[input.dataset.websiteField] = input.value;
      });
      state.actionKey = `website:${websiteId}`;
      render();
      try {
        await api('/api/admin/website-action', {
          method: 'POST',
          body: JSON.stringify({ website_id: websiteId, fields })
        });
        state.actionKey = '';
        showToast('Agent website updated.');
        await loadAll({ showLoading: false });

    async function exportQrBatch() {
      const typeInput = document.getElementById('qrBatchInventoryType');
      const inventoryType = ['agent', 'smart_sign', 'event_pass'].includes(typeInput?.value)
        ? typeInput.value
        : 'agent';
      const typeLabels = {
        agent: 'Agent Rel8tionChip',
        smart_sign: 'Smart Sign',
        event_pass: 'Event Pass'
      };
      const typeLabel = typeLabels[inventoryType];
      const quantityInput = document.getElementById('qrBatchQuantity');
      const quantity = Math.floor(Number(quantityInput?.value || 1));
      if (!Number.isFinite(quantity) || quantity < 1 || quantity > 100) {
        showToast(`Choose between 1 and 100 ${typeLabel} QR codes.`);
        quantityInput?.focus();
        return;
      }
      const confirmation = inventoryType === 'smart_sign'
        ? `Create ${quantity} new regular Smart Sign inventory row${quantity === 1 ? '' : 's'}, mark them printed, and download the QR ZIP? This will not create or change Event Passes or agent chips.`
        : `Reserve the next ${quantity} fresh unprinted ${typeLabel} QR code${quantity === 1 ? '' : 's'}, mark them printed, and download the ZIP?`;
      if (!window.confirm(confirmation)) return;

      state.qrBatchType = inventoryType;
      state.actionKey = 'export_qr_batch';
      refreshAreaContent();
      try {
        const response = await fetch('/api/admin/agent-qr-batch', {
          method: 'POST',
          cache: 'no-store',
          headers: authHeaders(),
          body: JSON.stringify({ quantity, inventory_type: inventoryType })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || `QR export failed: ${response.status}`);
        }
        const blob = await response.blob();
        const disposition = response.headers.get('content-disposition') || '';
        const filenamePrefix = inventoryType === 'event_pass'
          ? 'event-pass-qr'
          : inventoryType === 'smart_sign' ? 'smart-sign-qr' : 'agent-qr';
        const filename = disposition.match(/filename="([^"]+)"/i)?.[1] || `${filenamePrefix}-batch-${Date.now()}.zip`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        const count = response.headers.get('x-rel8tion-code-count') || quantity;
        showToast(inventoryType === 'smart_sign'
          ? `${count} new Smart Sign QR code${Number(count) === 1 ? '' : 's'} created, exported, and marked printed.`
          : `${count} ${typeLabel} QR code${Number(count) === 1 ? '' : 's'} exported and marked printed.`);
      } catch (error) {
        showToast(error.message || `Unable to export ${typeLabel} QR codes.`);
      } finally {
        state.actionKey = '';
        refreshAreaContent();
      }
    }

    function eventPassTone(row) {
      if (row.pass_state === 'live') return 'ok';

    function isLiveEvent(row) {
      return row?.status === 'active' && !row?.ended_at;
    }

    function adminEventTime(row) {
      const value = isLiveEvent(row)
        ? row.last_activity_at || row.start_time || row.created_at
        : row.ended_at || row.end_time || row.updated_at || row.created_at;
      const time = new Date(value || 0).getTime();
      return Number.isFinite(time) ? time : 0;
    }

    function sortAdminEvents(rows) {
      return [...rows].sort((a, b) => {
        const liveDelta = Number(isLiveEvent(b)) - Number(isLiveEvent(a));
        if (liveDelta) return liveDelta;
        return adminEventTime(b) - adminEventTime(a);
      });
    }

    function agentLookupValue(row) {
      return row?.phone_normalized
        || row?.agent_phone_normalized
        || row?.phone
        || row?.agent_phone
        || row?.email
        || row?.agent_email
        || row?.name
        || row?.agent_name
        || '';
    }

    function normalizedAgentValue(value) {
      return String(value || '').trim().toLowerCase();
    }

    function normalizedAgentPhone(value) {
      const digits = String(value || '').replace(/\D/g, '');
      return digits.length >= 10 ? digits.slice(-10) : digits;
    }

    function findAgentByLookup(lookup, rows = state.command?.crm || []) {
      const wanted = normalizedAgentValue(lookup);
      const wantedPhone = normalizedAgentPhone(lookup);
      if (!wanted) return null;
      return (rows || []).find((row) => {
        const values = [
          row.id,
          row.agent_id,
          row.ranking_id,
          row.slug,
          row.agent_slug,
          row.identity_key,
          row.phone_normalized,
          row.agent_phone_normalized,
          row.phone,
          row.agent_phone,
          row.email,
          row.agent_email,
          row.name,
          row.agent_name
        ].filter(Boolean);
        if (values.some((value) => normalizedAgentValue(value) === wanted)) return true;
        return Boolean(wantedPhone && values.some((value) => normalizedAgentPhone(value) === wantedPhone));
      }) || null;
    }

    function mergeHydratedAgentProfiles(profiles) {
      if (!state.command || !Array.isArray(profiles) || !profiles.length) return;
      const next = [...(state.command.crm || [])];
      for (const profile of profiles) {
        const lookups = [
          profile.id,
          profile.agent_id,
          profile.ranking_id,
          profile.slug,
          profile.phone_normalized,
          profile.phone,
          profile.email,
          profile.name
        ].filter(Boolean);
        const index = next.findIndex((row) => lookups.some((value) => findAgentByLookup(value, [row])));
        if (index >= 0) next[index] = { ...next[index], ...profile };
        else next.unshift(profile);
      }
      state.command.crm = next;
      rebuildCommandIndexes();
    }

    async function hydrateAgentProfile(agent) {
      const requestKey = normalizedAgentValue(agent);
      if (!requestKey || state.agentHydrationKey === requestKey) return;
      state.agentHydrationKey = requestKey;
      state.agentHydrationError = '';
      refreshAreaContent();
      try {
        const result = await api(`/api/admin/agent-profile?agent=${encodeURIComponent(agent)}`);
        if (normalizedAgentValue(state.agentFocus) !== requestKey) return;
        mergeHydratedAgentProfiles(result.profiles || []);
        if (!findAgentByLookup(agent, state.command?.crm || [])) {
          state.agentHydrationError = 'No unified agent record matched this outreach identity.';
        }
      } catch (error) {
        if (normalizedAgentValue(state.agentFocus) === requestKey) {
          state.agentHydrationError = error.message || 'Unable to load the full agent record.';
        }
      } finally {
        if (normalizedAgentValue(state.agentFocus) === requestKey) refreshAreaContent();
      }
    }

    function activeVisitForOpenHouse(row) {
      if (!row) return null;
      const openHouseIds = new Set([
        row.open_house_id,
        row.id,
        row.source_listing_id
      ].filter(Boolean).map(String));
      const queueIds = new Set([
        row.outreach_queue_id,
        row.queue_row_id
      ].filter(Boolean).map(String));
      return (state.command?.field_visits || []).find((visit) => {
        if (['cancelled', 'completed', 'converted'].includes(visit.status || '')) return false;
        const visitEnd = new Date(visit.scheduled_end || visit.scheduled_start || 0).getTime();
        if (Number.isFinite(visitEnd) && visitEnd < Date.now()) return false;
        if (String(visit.id || '') === String(row.id || '')) return true;
        if (visit.open_house_id && openHouseIds.has(String(visit.open_house_id))) return true;
        return Boolean(visit.outreach_queue_id && queueIds.has(String(visit.outreach_queue_id)));
      }) || null;
    }

    function acceptedOutreachForOpenHouse(row) {
      if (!row) return null;
      const acceptedStatuses = new Set(['accepted_open_house', 'confirmed_open_house']);
      const openHouseIds = new Set([
        row.open_house_id,
        row.id,
        row.source_listing_id
      ].filter(Boolean).map(String));
      const queueIds = new Set([
        row.outreach_queue_id,
        row.queue_row_id,
        acceptedStatuses.has(row.review_status) ? row.id : ''
      ].filter(Boolean).map(String));
      const directQueueId = row.queue_row_id || row.outreach_queue_id || (acceptedStatuses.has(row.review_status) ? row.id : '');
      const directEnd = new Date(row.open_end || row.scheduled_end || row.confirmed_coverage_end || row.listed_open_end || row.open_start || 0).getTime();
      if (directQueueId && acceptedStatuses.has(row.review_status) && (!Number.isFinite(directEnd) || directEnd >= Date.now())) {
        return { ...row, queue_row_id: directQueueId };
      }
      return (state.command?.confirmed_open_houses || []).find((report) => {
        if (!acceptedStatuses.has(report.review_status)) return false;
        const reportEnd = new Date(report.confirmed_coverage_end || report.scheduled_end || report.listed_open_end || report.confirmed_coverage_start || report.scheduled_start || report.listed_open_start || 0).getTime();
        if (Number.isFinite(reportEnd) && reportEnd < Date.now()) return false;
        if (report.queue_row_id && queueIds.has(String(report.queue_row_id))) return true;
        return Boolean(report.open_house_id && openHouseIds.has(String(report.open_house_id)));
      }) || null;
    }

          </div>
          <button class="btn primary" id="autoAssignLo" ${activeProfiles.length && events.length ? '' : 'disabled'}>

          </button>

            <div class="primary">${esc(row.loan_officer_name || 'NMB coverage')}</div>
            <div class="secondary">${esc([row.loan_officer_company, fmtPhone(row.loan_officer_phone), row.loan_officer_email].filter(Boolean).join(' | '))}</div>

          <div>
            <div class="secondary">${esc(row.coverage_areas || 'No area listed')}</div>
            <div class="secondary">${esc(row.availability || 'No availability listed')}</div>

        ${renderRows(

          `${visits.filter((row) => row.status !== 'cancelled').length} scheduled field visits`,
          visits.filter((row) => row.status !== 'cancelled').slice(0, 80),
          (row) => renderAcceptedOpenHouseRow(row, activeProfiles)
        )}
        ${renderRows('Loan officers', `${activeProfiles.length} active verified profiles${profiles.length > activeProfiles.length ? `, ${profiles.length - activeProfiles.length} removed` : ''}`, activeProfiles.slice(0, 80), (row) => {
