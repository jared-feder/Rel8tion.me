<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reuse Your Event Pass | REL8TION</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--navy:#1f2a5a;--blue:#3478f6;--sky:#eff8ff;--ink:#17213f;--muted:#64748b;--line:#dbe7f4;--green:#0f9f6e;--shadow:0 24px 70px rgba(31,42,90,.14)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#dff4ff 0,transparent 38%),linear-gradient(155deg,#f8fbff,#edf5ff 55%,#f9fbff);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,a{font:inherit}.shell{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 0 max(34px,env(safe-area-inset-bottom))}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--navy);font-size:14px;font-weight:950;letter-spacing:.14em}.brand-dot{width:15px;height:15px;border-radius:5px;background:linear-gradient(145deg,#55c5ff,#325eea);box-shadow:0 6px 18px rgba(52,120,246,.35)}
    .hero{margin:22px 0 18px;padding:clamp(24px,6vw,54px);border:1px solid rgba(255,255,255,.85);border-radius:32px;background:rgba(255,255,255,.82);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.eyebrow{color:var(--blue);font-size:12px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.hero h1{max-width:820px;margin:10px 0 12px;font-size:clamp(34px,7vw,62px);line-height:1.02;letter-spacing:-.045em}.hero p{max-width:760px;margin:0;color:var(--muted);font-size:clamp(17px,2.2vw,21px);font-weight:650;line-height:1.55}.property{display:flex;gap:12px;align-items:center;margin-top:20px;padding:14px 16px;border-radius:18px;background:#f5f9ff;border:1px solid var(--line);font-weight:850}.property span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:3px}
    .options{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(255,255,255,.9);padding:clamp(22px,4vw,34px);box-shadow:0 18px 50px rgba(31,42,90,.1)}.card.primary{border-color:#b9def8;background:linear-gradient(150deg,#fff,#eff9ff)}.option-label{font-size:11px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}.officer{display:flex;align-items:center;gap:16px;margin:18px 0}.avatar{width:88px;height:88px;border-radius:24px;object-fit:cover;border:4px solid #fff;box-shadow:0 12px 28px rgba(31,42,90,.18);background:#dceeff}.avatar-fallback{display:grid;place-items:center;color:var(--navy);font-size:28px;font-weight:950}.officer h2,.card h2{margin:0;font-size:clamp(25px,4vw,34px);line-height:1.1;letter-spacing:-.025em}.officer p{margin:6px 0 0;color:var(--muted);font-weight:750}.copy{color:#43516d;font-size:16px;font-weight:650;line-height:1.58}.notice{margin:18px 0;padding:16px;border-radius:18px;background:#fff8e7;border:1px solid #f6d58b;color:#78520b;font-size:14px;font-weight:800;line-height:1.5}.consent{display:flex;align-items:flex-start;gap:11px;margin:16px 0;color:#31405e;font-size:14px;font-weight:750;line-height:1.45}.consent input{width:21px;height:21px;flex:0 0 auto;margin-top:1px}.btn{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;text-align:center;border:0;border-radius:18px;padding:14px 18px;text-decoration:none;font-weight:950;cursor:pointer;transition:.18s transform,.18s opacity;background:linear-gradient(100deg,#3478f6,#2456d6);color:#fff;box-shadow:0 13px 28px rgba(52,120,246,.25)}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.48;cursor:not-allowed;transform:none}.btn.secondary{margin-top:10px;background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.price{display:flex;align-items:flex-end;gap:6px;margin:18px 0}.price strong{font-size:48px;line-height:.9;letter-spacing:-.05em;color:var(--navy)}.price span{color:var(--muted);font-weight:850}.features{display:grid;gap:11px;margin:20px 0 24px;padding:0;list-style:none}.features li{position:relative;padding-left:29px;color:#3e4d69;font-weight:750;line-height:1.4}.features li:before{content:'✓';position:absolute;left:0;top:0;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#ddf8ed;color:#087854;font-size:13px;font-weight:950}.status{margin:14px 0 0;color:var(--muted);font-weight:800;line-height:1.45}.error{padding:18px;border-radius:18px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.success{padding:clamp(26px,7vw,58px);text-align:center}.success h1{font-size:clamp(34px,7vw,58px);margin:10px 0}.success .btn{max-width:440px;margin:22px auto 0}.hidden{display:none!important}
    @media(max-width:780px){.shell{width:min(100% - 20px,620px);padding-top:14px}.hero{border-radius:25px;padding:26px 20px}.hero h1{font-size:38px}.options{grid-template-columns:1fr}.card{border-radius:24px;padding:23px 19px}.officer{align-items:flex-start}.avatar{width:76px;height:76px;border-radius:21px}.price strong{font-size:42px}.btn{position:relative;z-index:1}.primary{order:1}.membership-card{order:2}}
    @media(max-width:780px) and (max-height:700px){.shell{padding-top:8px}.brand{font-size:11px}.hero{margin:12px 0;padding:18px 16px}.hero h1{font-size:30px;margin-top:7px}.hero p{font-size:15px;line-height:1.4}.property{margin-top:12px;padding:10px 12px}.property span{font-size:10px}.card{padding-top:20px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-dot"></span> REL8TION EVENT PASS</div>
    <div id="app">
      <section class="hero"><div class="eyebrow">Checking your Event Pass</div><h1>Loading your options…</h1><p>We’re keeping your selected open house ready.</p></section>
    </div>
  </main>
  <script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(location.search);
    const state = { context: null, busy: false };
    const value = (key) => String(params.get(key) || '').trim();
    const esc = (input) => String(input == null ? '' : input).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const initials = (name) => String(name || 'LO').split(/\s+/).filter(Boolean).slice(0,2).map((part) => part[0]).join('').toUpperCase();
    const activationBody = (reuseMode) => ({
      action: 'activate_event_pass',
      uid: value('uid'),
      agent_slug: value('agent'),
      public_code: value('code'),
      sign_id: value('sign_id'),
      open_house_id: value('open_house_id'),
      supporting_listing_agent: value('supporting_listing_agent') === 'true',
      reuse_mode: reuseMode,
      consent_accepted: reuseMode === 'loan_officer_sponsored',
      sponsor_profile_id: state.context?.sponsor?.uid || state.context?.sponsor?.id || ''
    });

    function officerPhoto(officer) {
      if (officer?.photo_url) return `<img class="avatar" src="${esc(officer.photo_url)}" alt="${esc(officer.name || 'Loan officer')}">`;
      return `<div class="avatar avatar-fallback" aria-label="${esc(officer?.name || 'Loan officer')}">${esc(initials(officer?.name))}</div>`;
    }

    function currentReturnPath() {
      const next = new URLSearchParams(params);
      next.delete('membership');
      next.delete('membership_error');
      return `/event-pass-reuse?${next.toString()}`;
    }

    function renderOptions() {
      const data = state.context;
      const sponsor = data.sponsor;
      const membershipActive = data.membership_active || value('membership') === 'active';
      const sponsorCard = sponsor ? `
        <article class="card primary">
          <div class="option-label">Option 1 · Sponsored open house</div>
          <div class="officer">${officerPhoto(sponsor)}<div><h2>${esc(sponsor.name || 'Your loan officer')}</h2><p>${esc([sponsor.title,sponsor.company].filter(Boolean).join(' · ') || 'Loan officer sponsor')}</p></div></div>
          <p class="copy"><strong>Your loan officer will sponsor this open house as well.</strong> Just make sure you thank them and stay in contact so you can continue building a lasting REL8TIONship.</p>
          <div class="notice">This is a limited version of REL8TION. ${esc(sponsor.name || 'Your loan officer')} will appear as the sponsoring loan officer for this open house and receive event check-in visibility. Financing help is shared only when a buyer requests it.</div>
          <label class="consent"><input id="sponsorConsent" type="checkbox"><span>I authorize ${esc(sponsor.name || 'this loan officer')} to sponsor and support this open house.</span></label>
          <button id="sponsorButton" class="btn" type="button" disabled>Continue With ${esc(sponsor.name || 'My Loan Officer')} Sponsoring</button>
          <p id="sponsorStatus" class="status"></p>
        </article>` : `
        <article class="card primary">
          <div class="option-label">Sponsored option unavailable</div>
          <h2 style="margin-top:14px">No loan officer is assigned yet</h2>
          <p class="copy">REL8TION could not verify an active loan officer relationship for this open house. Choose full REL8TION Agent membership below or contact support to assign coverage.</p>
        </article>`;
      const membershipAction = membershipActive
        ? `<button id="memberContinueButton" class="btn" type="button">Continue With Full REL8TION</button>`
        : `<button id="membershipCheckoutButton" class="btn" type="button">Enroll for ${esc(data.plan.label)}</button>`;
      app.innerHTML = `
        <section class="hero">
          <div class="eyebrow">Event Pass reuse</div>
          <h1>Choose how to continue this open house.</h1>
          <p>REL8TION Agent membership is required to reuse this Event Pass unless your assigned loan officer sponsors this event.</p>
          <div class="property"><div><span>Selected open house</span>${esc(data.house.address || 'Open house')}</div></div>
          ${value('membership') === 'canceled' ? '<div class="notice">Checkout was canceled. Nothing was charged and your open house selection is still here.</div>' : ''}
        </section>
        <section class="options">
          ${sponsorCard}
          <article class="card membership-card">
            <div class="option-label">Option 2 · Full REL8TION</div>
            <h2 style="margin-top:14px">Remove the sponsorship message and unlock everything.</h2>
            <div class="price"><strong>${esc(data.plan.label.replace('/month',''))}</strong><span>/month</span></div>
            <p class="copy">Full REL8TION transforms this same Rel8tionChip into your digital business card and networking tool.</p>
            <ul class="features">
              <li>Your permanent agent dashboard</li>
              <li>Your public profile and digital business card</li>
              <li>Current and future open-house check-ins</li>
              <li>Event history and signed disclosure records</li>
              <li>Automated and REL8TION-assisted follow-up</li>
            </ul>
            ${membershipAction}
            <p id="membershipStatus" class="status">${membershipActive ? 'Your membership is active. Continue to register the selected open house.' : 'Secure monthly subscription. Current catalog price: ' + esc(data.plan.label) + '.'}</p>
          </article>
        </section>`;

      const consent = document.getElementById('sponsorConsent');
      const sponsorButton = document.getElementById('sponsorButton');
      consent?.addEventListener('change', () => { sponsorButton.disabled = !consent.checked || state.busy; });
      sponsorButton?.addEventListener('click', () => activate('loan_officer_sponsored', 'sponsorStatus'));
      document.getElementById('memberContinueButton')?.addEventListener('click', () => activate('membership', 'membershipStatus'));
      document.getElementById('membershipCheckoutButton')?.addEventListener('click', startCheckout);
    }

    async function activate(mode, statusId) {
      if (state.busy) return;
      state.busy = true;
      const status = document.getElementById(statusId);
      document.querySelectorAll('button').forEach((button) => { button.disabled = true; });
      if (status) status.textContent = mode === 'loan_officer_sponsored' ? 'Recording sponsorship and activating your open house…' : 'Activating your open house…';
      try {
        const response = await fetch('/api/event-pass/action', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(activationBody(mode))
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.ok === false) throw new Error(result.error || 'This Event Pass could not be activated.');
        const sponsorLine = result.limited_sponsored && state.context?.sponsor
          ? `<p class="copy">${esc(state.context.sponsor.name)} is now sponsoring this open house. Thank them and keep building the relationship.</p>`
          : '<p class="copy">Your full REL8TION Agent membership is active for this open house.</p>';
        app.innerHTML = `<section class="hero success"><div class="eyebrow">Success</div><h1>Your Open House Is Live</h1>${sponsorLine}<a class="btn" href="${esc(result.dashboard_url || '/agent-dashboard')}">Open Live Dashboard</a></section>`;
      } catch (error) {
        state.busy = false;
        renderOptions();
        const nextStatus = document.getElementById(statusId);
        if (nextStatus) nextStatus.innerHTML = `<span class="error" style="display:block">${esc(error.message || 'Activation failed.')}</span>`;
      }
    }

    async function startCheckout() {
      if (state.busy) return;
      state.busy = true;
      const button = document.getElementById('membershipCheckoutButton');
      const status = document.getElementById('membershipStatus');
      if (button) button.disabled = true;
      if (status) status.textContent = 'Opening secure checkout…';
      try {
        const response = await fetch('/api/checkout/plan', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            plan_code: state.context.plan.code,
            source: 'event_pass_rel8tionchip',
            agent_slug: value('agent'),
            uid: value('uid'),
            email: state.context.agent.email || '',
            return_path: currentReturnPath()
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.url) throw new Error(result.error || 'Checkout could not be started.');
        location.href = result.url;
      } catch (error) {
        state.busy = false;
        if (button) button.disabled = false;
        if (status) status.innerHTML = `<span class="error" style="display:block">${esc(error.message || 'Checkout could not be started.')}</span>`;
      }
    }

    async function init() {
      try {
        const query = new URLSearchParams({
          uid: value('uid'),
          agent: value('agent'),
          code: value('code'),
          open_house_id: value('open_house_id'),
          supporting_listing_agent: value('supporting_listing_agent')
        });
        const response = await fetch(`/api/event-pass/reuse-options?${query.toString()}`, {headers:{Accept:'application/json'},cache:'no-store'});
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.error || 'Your Event Pass options could not be loaded.');
        state.context = data;
        renderOptions();
      } catch (error) {
        app.innerHTML = `<section class="hero"><div class="eyebrow">Event Pass needs attention</div><h1>We couldn’t load your reuse options.</h1><div class="error">${esc(error.message || 'Try the Event Pass again or contact REL8TION support.')}</div><a class="btn secondary" href="mailto:jared@rel8tion.me" style="max-width:360px;margin-top:18px">Contact REL8TION Support</a></section>`;
      }
    }
    init();
  </script>
</body>
</html>
